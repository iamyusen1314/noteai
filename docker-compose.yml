services:
  noteai:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # 持久化数据目录（DB + 模型文件 + 热词库）
      - ./model/data:/app/model/data
      - ./model/artifacts:/app/model/artifacts
    env_file:
      - ./model/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  noteai-admin:
    build: .
    command: ["python", "-m", "uvicorn", "admin_server:admin_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${ADMIN_PORT:-8001}:8001"
    volumes:
      # 与主 API 共享 DB、模型文件、热词库，保证管理端发布模型后 API 可读取
      - ./model/data:/app/model/data
      - ./model/artifacts:/app/model/artifacts
    env_file:
      - ./model/.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  noteai-trends-worker:
    build: .
    command: ["python", "market_timing_worker.py", "--daemon", "--interval", "${NOTEAI_MARKET_TIMING_WORKER_INTERVAL_MINUTES:-60}"]
    volumes:
      # 独立趋势 worker 写入每日行业热词快照；API 只读取，不在自身进程采集
      - ./model/data:/app/model/data
    env_file:
      - ./model/.env
    environment:
      - PYTHONUNBUFFERED=1
      - NOTEAI_SKIP_MODEL_ARTIFACT_CHECK=1
    restart: unless-stopped
