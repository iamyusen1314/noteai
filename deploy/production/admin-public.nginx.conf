# Included in the existing API-C http context only. No public product route changes.
limit_req_zone $binary_remote_addr zone=admin_login_source:1m rate=6r/m;
limit_req_zone $server_name zone=admin_login_total:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin_queries:1m rate=10r/s;
log_format noteai_admin '$time_iso8601 $remote_addr $request_method $uri $status';
server {
    listen 80;
    server_name admin.noteaipro.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/noteai-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://admin.noteaipro.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name admin.noteaipro.com;
    ssl_certificate /etc/letsencrypt/live/admin.noteaipro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.noteaipro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    root /var/www/noteai-admin/current;
    client_max_body_size 8k;
    limit_req zone=admin_queries burst=30 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/noteai-admin-access.log noteai_admin;
    error_log /var/log/nginx/noteai-admin-error.log crit;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location = / { limit_except GET { deny all; } try_files /index.html =404; }
    location = /index.html { limit_except GET { deny all; } try_files $uri =404; }
    location = /assets/product-app.js { limit_except GET { deny all; } try_files $uri =404; }
    location = /assets/product-events.js { limit_except GET { deny all; } try_files $uri =404; }
    location = /assets/vendor/echarts-5.4.3.min.js { limit_except GET { deny all; } try_files $uri =404; }
    location = /admin/login {
        limit_except POST { deny all; }
        limit_req zone=admin_login_source burst=2 nodelay;
        limit_req zone=admin_login_total burst=5 nodelay;
        include /etc/nginx/noteai-admin-proxy.conf;
    }
    location = /admin/logout {
        limit_except POST { deny all; }
        include /etc/nginx/noteai-admin-proxy.conf;
    }
    location ~ ^/admin/(me|capabilities|overview|ai-operations|users|users/[A-Za-z0-9_-]+|revenue|usage-stats|settings|logs|prompts|prompts/[A-Za-z0-9_-]+|prompts/[A-Za-z0-9_-]+/effective|models|crawler/status|crawler/logs|xhs/freshness|xhs/health)$ {
        limit_except GET { deny all; }
        include /etc/nginx/noteai-admin-proxy.conf;
    }
    location / { return 404; }
}
