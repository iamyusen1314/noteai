user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 15;
    client_header_timeout 10;
    client_body_timeout 10;
    client_max_body_size 8k;
    limit_req_zone $binary_remote_addr zone=website:1m rate=10r/s;
    server { listen 80 default_server; server_name _; return 444; }
    server {
        listen 80;
        server_name noteaipro.com www.noteaipro.com;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/noteai-acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 301 https://$host$request_uri; }
    }
    # HTTPS starts here; the bootstrap configuration ends before this marker.
    server { listen 443 ssl default_server; ssl_reject_handshake on; }
    server {
        listen 443 ssl;
        server_name noteaipro.com www.noteaipro.com;
        ssl_certificate /etc/letsencrypt/live/noteaipro.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/noteaipro.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /var/www/noteai-public/current;
        limit_req zone=website burst=30 nodelay;
        limit_req_status 429;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Only the three public files are served. Existing API/Admin stay private.
        location = / { limit_except GET { deny all; } try_files /index.html =404; }
        location = /index.html { limit_except GET { deny all; } try_files $uri =404; }
        location = /site.css { limit_except GET { deny all; } try_files $uri =404; }
        location = /site.js { limit_except GET { deny all; } try_files $uri =404; }
        location = /public/status {
            default_type application/json;
            add_header Cache-Control no-store always;
            return 200 '{"release":"website_and_accounts","registration_open":false,"payment_open":false,"ai_open":false,"tracking_open":false,"contract_version":"account-access-2026-09-12"}';
        }
        location / { return 404; }
    }
}
