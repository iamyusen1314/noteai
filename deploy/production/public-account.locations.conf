# Include inside the existing HTTPS server only after private validation.
# Replace its static /public/status location; keep the default location404.
location = /public/status {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /legal/contracts {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/me {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/verification/request {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/register/otp {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/login/otp {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/logout {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
