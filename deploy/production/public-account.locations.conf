# Include inside the existing HTTPS server only after private validation.
# Replace its static /public/status location; keep the default location404.
location = /public/status {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /legal/contracts {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/me {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/verification/request {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/register/otp {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/login/otp {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}
location = /auth/logout {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}

# Current authorized free product. Activate with the matching scoped API image.
location ~ ^/(analyze/stream|generate/stream|chat/start|chat/message|chat/select-plan)$ {
    limit_except POST { deny all; }
    client_max_body_size 64k;
    include /etc/nginx/noteai-product-proxy.conf;
}
location = /notes {
    limit_except GET POST { deny all; }
    client_max_body_size 64k;
    include /etc/nginx/noteai-product-proxy.conf;
}
location ~ ^/(billing/(tiers|plan|usage|credits)|diagnoses|profile/(growth|memories|achievements))$ {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-product-proxy.conf;
}
location ~ "^/(notes|diagnoses)/([0-9a-f]{32}|[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})(/versions)?$" {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-product-proxy.conf;
}

location = /auth/contracts/accept {
    limit_except POST { deny all; }
    include /etc/nginx/noteai-account-proxy.conf;
}

# Native-first callbacks use provider signatures, not browser Origin/session.
location = /payments/wechat/callback {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    include /etc/nginx/noteai-product-proxy.conf;
}
location = /payments/capabilities {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-product-proxy.conf;
}
location = /payments/orders {
    limit_except GET POST { deny all; }
    client_max_body_size 8k;
    include /etc/nginx/noteai-product-proxy.conf;
}
location ~ "^/payments/orders/[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}$" {
    limit_except GET { deny all; }
    include /etc/nginx/noteai-product-proxy.conf;
}
