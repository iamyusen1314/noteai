services:
  - type: web
    name: noteai-staging-claude-gateway
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: .
    dockerCommand: /app/start.sh
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NOTEAI_CLAUDE_GATEWAY_HMAC_KEY_ID
        sync: false
      - key: NOTEAI_CLAUDE_GATEWAY_HMAC_SECRET
        sync: false
      - key: NOTEAI_CLAUDE_GATEWAY_INSTANCE_COUNT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: NOTEAI_CLAUDE_GATEWAY_CONCURRENCY
        value: "2"
      - key: NOTEAI_CLAUDE_GATEWAY_MAX_BODY_BYTES
        value: "8388608"
      - key: NOTEAI_CLAUDE_GATEWAY_MAX_TOKENS
        value: "16000"
      - key: NOTEAI_CLAUDE_GATEWAY_TIMESTAMP_SKEW_SECONDS
        value: "300"
      - key: NOTEAI_CLAUDE_GATEWAY_REQUESTS_PER_MINUTE
        value: "30"
