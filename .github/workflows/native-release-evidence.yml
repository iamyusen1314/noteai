name: Native AMD64 release evidence

on:
  push:
    branches:
      - codex/quality-stabilization-real-chain
    paths:
      - .github/workflows/native-release-evidence.yml
      - .github/release-requests/admin-5335bda-v2.json
      - scripts/ci/native_release_evidence.sh
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character source commit to build
        required: true
        type: string
      release_scope:
        description: Exact runtime-role scope to build and scan
        required: true
        default: five
        type: choice
        options:
          - five
          - admin

permissions:
  contents: read

concurrency:
  group: native-release-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    name: Build and scan native AMD64 roles
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      NOTEAI_ADMIN_PUSH_REQUEST: .github/release-requests/admin-5335bda-v2.json
      NOTEAI_ADMIN_PUSH_REQUEST_SHA256: c5bd56148af0d780d3955ebb9ed5dafe0c7507ba6974da86b5830323c77009ef
      NOTEAI_OCI_SOURCE: https://github.com/iamyusen1314/noteai
      SYFT_VERSION: "1.49.0"
      SYFT_SHA256: 7aa2f03ee92739cf643279ba3990548b9925d4e22cae13f46831ee62821147fe
      TRIVY_VERSION: "0.72.0"
      TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
      BUILDX_METADATA_PROVENANCE: max

    steps:
      - name: Checkout controller commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Resolve and validate release control
        id: control
        env:
          REQUESTED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          REQUESTED_RELEASE_SCOPE: ${{ inputs.release_scope }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"

          release_commit=""
          release_scope=""
          request_path=""
          request_sha256=""

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_commit="${REQUESTED_RELEASE_COMMIT}"
            release_scope="${REQUESTED_RELEASE_SCOPE}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            test "${GITHUB_REF_NAME}" = "codex/quality-stabilization-real-chain"
            parent_record="$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
            read -r -a parent_fields <<<"${parent_record}"
            test "${#parent_fields[@]}" -eq 2
            test "${parent_fields[0]}" = "${GITHUB_SHA}"
            controller_parent="$(git rev-parse "${GITHUB_SHA}^")"

            added_requests_file="${RUNNER_TEMP}/noteai-added-release-requests"
            git diff-tree --no-commit-id --no-renames --diff-filter=A \
              --name-only -z -r "${controller_parent}" "${GITHUB_SHA}" \
              -- .github/release-requests/ > "${added_requests_file}"
            added_requests=()
            while IFS= read -r -d '' added_request; do
              added_requests+=("${added_request}")
            done < "${added_requests_file}"
            if [[ "${#added_requests[@]}" -eq 0 ]]; then
              release_commit="${GITHUB_SHA}"
              release_scope="five"
            else
              test "${#added_requests[@]}" -eq 1
              test "${added_requests[0]}" = "${NOTEAI_ADMIN_PUSH_REQUEST}"
              test "$(
                git diff-tree --no-commit-id --no-renames --diff-filter=A \
                  --name-status -r "${controller_parent}" "${GITHUB_SHA}" \
                  -- "${NOTEAI_ADMIN_PUSH_REQUEST}"
              )" = $'A\t'"${NOTEAI_ADMIN_PUSH_REQUEST}"
              test "$(
                git ls-tree "${GITHUB_SHA}" -- "${NOTEAI_ADMIN_PUSH_REQUEST}" |
                  awk '{print $1 " " $2}'
              )" = "100644 blob"

              request_file="${RUNNER_TEMP}/noteai-admin-release-request.json"
              git show "${GITHUB_SHA}:${NOTEAI_ADMIN_PUSH_REQUEST}" \
                > "${request_file}"
              jq -e '
                type == "object"
                and
                (keys | sort) == [
                  "database_authorized",
                  "deployment_authorized",
                  "public_traffic_authorized",
                  "registry_publication_authorized",
                  "release_commit",
                  "release_scope",
                  "schema_version",
                  "service_mutation_authorized",
                  "task",
                  "trigger_mode"
                ]
                and .schema_version == 2
                and .task == "PROD-FIRST-LAUNCH-ADMIN-INTERNAL-001"
                and .release_commit == "5335bdaed933b1f999b5f819c047ec50c11821ae"
                and .release_scope == "admin"
                and .trigger_mode == "one_shot_controller_diff_v2"
                and .registry_publication_authorized == false
                and .deployment_authorized == false
                and .database_authorized == false
                and .service_mutation_authorized == false
                and .public_traffic_authorized == false
              ' "${request_file}" >/dev/null
              request_sha256="$(sha256sum "${request_file}" | awk '{print $1}')"
              test "${request_sha256}" = "${NOTEAI_ADMIN_PUSH_REQUEST_SHA256}"
              release_commit="5335bdaed933b1f999b5f819c047ec50c11821ae"
              git cat-file -e "${release_commit}^{commit}"
              git merge-base --is-ancestor "${release_commit}" "${GITHUB_SHA}"

              request_history_file="${RUNNER_TEMP}/noteai-admin-request-history"
              git log --diff-filter=A --format=%H "${GITHUB_SHA}" -- \
                "${NOTEAI_ADMIN_PUSH_REQUEST}" > "${request_history_file}"
              request_add_commits=()
              while IFS= read -r request_add_commit; do
                request_add_commits+=("${request_add_commit}")
              done < "${request_history_file}"
              test "${#request_add_commits[@]}" -eq 1
              test "${request_add_commits[0]}" = "${GITHUB_SHA}"

              release_scope="admin"
              request_path="${NOTEAI_ADMIN_PUSH_REQUEST}"
            fi
          else
            echo "unsupported event: ${GITHUB_EVENT_NAME}" >&2
            exit 2
          fi

          if [[ ! "${release_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_commit must be an exact lowercase 40-character Git SHA" >&2
            exit 2
          fi
          case "${release_scope}" in
            five|admin) ;;
            *)
              echo "release_scope must be five or admin" >&2
              exit 2
              ;;
          esac

          printf 'release_commit=%s\n' "${release_commit}" >> "${GITHUB_OUTPUT}"
          printf 'release_scope=%s\n' "${release_scope}" >> "${GITHUB_OUTPUT}"
          printf 'request_path=%s\n' "${request_path}" >> "${GITHUB_OUTPUT}"
          printf 'request_sha256=%s\n' "${request_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'control_commit=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact source with full evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.control.outputs.release_commit }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Verify native runner and immutable source
        id: source
        env:
          RELEASE_COMMIT: ${{ steps.control.outputs.release_commit }}
          NOTEAI_RELEASE_SCOPE: ${{ steps.control.outputs.release_scope }}
          NOTEAI_REQUEST_PATH: ${{ steps.control.outputs.request_path }}
          NOTEAI_REQUEST_SHA256: ${{ steps.control.outputs.request_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          test -z "$(git status --short)"
          git lfs install --local
          git lfs pull
          git lfs ls-files
          python3 scripts/fetch_model_artifacts.py --check-only --required
          release_created="$(date -u -d "$(git show -s --format=%cI HEAD)" +%Y-%m-%dT%H:%M:%SZ)"
          release_short="$(git rev-parse --short=7 HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${NOTEAI_RELEASE_SCOPE}" == "admin" ]]; then
            test "${RELEASE_COMMIT}" = "5335bdaed933b1f999b5f819c047ec50c11821ae"
            test "${NOTEAI_REQUEST_PATH}" = "${NOTEAI_ADMIN_PUSH_REQUEST}"
            test "${NOTEAI_REQUEST_SHA256}" = "${NOTEAI_ADMIN_PUSH_REQUEST_SHA256}"
          fi
          printf 'release_created=%s\n' "${release_created}" >> "${GITHUB_OUTPUT}"
          printf 'release_short=%s\n' "${release_short}" >> "${GITHUB_OUTPUT}"

      - name: Install checksum-pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/noteai-release-tools"
          mkdir -p "${tool_dir}"
          curl --fail --silent --show-error --location \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
            --output "${tool_dir}/syft.tar.gz"
          printf '%s  %s\n' "${SYFT_SHA256}" "${tool_dir}/syft.tar.gz" | sha256sum --check -
          tar -xzf "${tool_dir}/syft.tar.gz" -C "${tool_dir}" syft
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${tool_dir}/trivy.tar.gz"
          printf '%s  %s\n' "${TRIVY_SHA256}" "${tool_dir}/trivy.tar.gz" | sha256sum --check -
          tar -xzf "${tool_dir}/trivy.tar.gz" -C "${tool_dir}" trivy
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Build, inspect, inventory and scan
        id: evidence
        env:
          RELEASE_COMMIT: ${{ steps.control.outputs.release_commit }}
          NOTEAI_RELEASE_SCOPE: ${{ steps.control.outputs.release_scope }}
          NOTEAI_REQUEST_PATH: ${{ steps.control.outputs.request_path }}
          NOTEAI_REQUEST_SHA256: ${{ steps.control.outputs.request_sha256 }}
          NOTEAI_CONTROL_COMMIT: ${{ steps.control.outputs.control_commit }}
          NOTEAI_OCI_CREATED: ${{ steps.source.outputs.release_created }}
          NOTEAI_OCI_VERSION: git-${{ steps.source.outputs.release_short }}-amd64-r1
          NOTEAI_EVIDENCE_DIR: ${{ runner.temp }}/noteai-native-release-evidence
        shell: bash
        run: |
          set -euo pipefail
          control_script="${RUNNER_TEMP}/noteai-native-release-evidence.sh"
          cp scripts/ci/native_release_evidence.sh "${control_script}"
          original_script_sha256="$(sha256sum "${control_script}" | awk '{print $1}')"
          if [[ "${NOTEAI_RELEASE_SCOPE}" == "admin" ]]; then
            python3 - "${control_script}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          original = "roles=(api admin payment ai-worker xhs-http)"
          replacement = "roles=(admin)"
          if source.count(original) != 1:
              raise SystemExit("canonical role list must occur exactly once")
          path.write_text(source.replace(original, replacement), encoding="utf-8")
          PY
          fi
          chmod 0500 "${control_script}"
          executed_script_sha256="$(sha256sum "${control_script}" | awk '{print $1}')"
          test -z "$(git status --short)"
          bash "${control_script}"
          test -z "$(git status --short)"

          if [[ "${NOTEAI_RELEASE_SCOPE}" == "admin" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              test -n "${NOTEAI_REQUEST_SHA256}"
            fi
            test "$(find "${NOTEAI_EVIDENCE_DIR}" -maxdepth 1 -type f | wc -l)" = "11"
            jq -e \
              --arg release_commit "${RELEASE_COMMIT}" \
              --arg release_created "${NOTEAI_OCI_CREATED}" \
              --arg release_version "${NOTEAI_OCI_VERSION}" '
              .release_commit == $release_commit
              and .created == $release_created
              and .version == $release_version
              and .runner_architecture == "x86_64"
              and (.roles | length == 1)
              and .roles[0].role == "admin"
              and .roles[0].target == "admin-runtime"
            ' "${NOTEAI_EVIDENCE_DIR}/summary.json" >/dev/null
            summary_tmp="${NOTEAI_EVIDENCE_DIR}/summary.json.tmp"
            jq \
              --arg original_script_sha256 "${original_script_sha256}" \
              --arg executed_script_sha256 "${executed_script_sha256}" \
              --arg trigger_event "${GITHUB_EVENT_NAME}" \
              --arg control_commit "${NOTEAI_CONTROL_COMMIT}" \
              --arg request_path "${NOTEAI_REQUEST_PATH}" \
              --arg request_sha256 "${NOTEAI_REQUEST_SHA256}" \
              '. + {
                control: {
                  release_scope: "admin",
                  source_tree_clean_after_execution: true,
                  resolution: "controller-checkout-single-parent-git-diff-tree-v2",
                  transformation: "exact canonical five-role list to admin only",
                  original_script_sha256: $original_script_sha256,
                  executed_script_sha256: $executed_script_sha256,
                  trigger_event: $trigger_event,
                  control_commit: $control_commit,
                  request_path: $request_path,
                  request_sha256: $request_sha256
                }
              }' "${NOTEAI_EVIDENCE_DIR}/summary.json" > "${summary_tmp}"
            mv "${summary_tmp}" "${NOTEAI_EVIDENCE_DIR}/summary.json"
          fi
          printf 'path=%s\n' "${NOTEAI_EVIDENCE_DIR}" >> "${GITHUB_OUTPUT}"
          printf 'original_script_sha256=%s\n' "${original_script_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'executed_script_sha256=%s\n' "${executed_script_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-amd64-release-evidence-${{ steps.control.outputs.release_commit }}${{ steps.control.outputs.release_scope == 'admin' && '-admin' || '' }}
          path: ${{ runner.temp }}/noteai-native-release-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 9

      - name: Enforce zero Critical or High findings
        if: always()
        env:
          NOTEAI_EVIDENCE_DIR: ${{ runner.temp }}/noteai-native-release-evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "${NOTEAI_EVIDENCE_DIR}/summary.json"
          jq -e '.passed == true' "${NOTEAI_EVIDENCE_DIR}/summary.json"
