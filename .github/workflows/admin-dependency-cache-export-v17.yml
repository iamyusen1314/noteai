name: Admin dependency cache export V17

on:
  push:
    branches:
      - codex/quality-stabilization-real-chain
    paths:
      - .github/release-requests/admin-5335bda-dependency-cache-v17.json

permissions:
  contents: read

concurrency:
  group: admin-dependency-cache-export-v10
  cancel-in-progress: false

jobs:
  export-cache:
    name: Recover and prove exact 5335 Admin dependency prefix cache
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      NOTEAI_REQUEST_PATH: .github/release-requests/admin-5335bda-dependency-cache-v17.json
      NOTEAI_WORKFLOW_PATH: .github/workflows/admin-dependency-cache-export-v17.yml
      NOTEAI_REQUEST_TEMPLATE: deploy/production/plans/admin-dependency-cache-export-request-v17.json
      NOTEAI_REQUEST_TEMPLATE_SHA256: be82c35d63f31ea6f3a33f0a2188e8fee12c43df73728dcea4f42421a611f7b1
      NOTEAI_C17_DATA_PLANE_ANCHOR: 7ee9a15425c38e8f0d5382cba488bd4a6ce92d6e
      NOTEAI_V4_TRANSIENT_VERIFIER_PATH: tools/verify_admin_dependency_cache_transient_state_v4.py
      NOTEAI_V4_TRANSIENT_VERIFIER_SHA256: a6578845bc220f38ffc819ced26d8d0c3530b37e53ebc4c74cceeb4b523ea432
      NOTEAI_V17_CACHE_IDENTITY_SOURCE_PROJECTION_PATH: tests/fixtures/admin_dependency_cache_v17_frontend_lifecycle_and_localstate_projection.json
      NOTEAI_V17_CACHE_IDENTITY_SOURCE_PROJECTION_SHA256: 5c020473f8f8e7cc189c3e936a8b41c76bdc2a9fde38fc79c7d11d31e9050b54
      NOTEAI_EXPORT_HELPER_PATH: scripts/ci/export_admin_dependency_cache_v17.sh
      NOTEAI_EXPORT_HELPER_SHA256: e2eb4b1466b245880fbb3bef7b34ae5f868ca8c1279def268038642d061b6eda
      NOTEAI_IMPORT_HELPER_PATH: scripts/ci/import_admin_dependency_cache_v17.sh
      NOTEAI_IMPORT_HELPER_SHA256: b39b98d969052417d779a124c7c942fe89d4bcd50db0ad1bcde5121800b8185d
      NOTEAI_BASE_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle.py
      NOTEAI_BASE_BUNDLE_VERIFIER_SHA256: bf526c29b213dc15d257cb9aedc52790aa1dc9cf1f82bba0e6e85e41db3edf38
      NOTEAI_V3_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v3.py
      NOTEAI_V3_BUNDLE_VERIFIER_SHA256: c2e318d5d9cbe196d8b9294277c85e1ee986ccb3e1970b3d25a31d28c8da0fef
      NOTEAI_V6_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v6.py
      NOTEAI_V6_BUNDLE_VERIFIER_SHA256: 86d93114e804bf6a51fdb160651d6a20c555f107b88020e0f8d811d0f0d358e5
      NOTEAI_V7_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v7.py
      NOTEAI_V7_BUNDLE_VERIFIER_SHA256: 76af4aa0c8dbe68b46cc71fb74f1582030c5f28a7218a2ee04bcbde5f4198cd7
      NOTEAI_V8_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v8.py
      NOTEAI_V8_BUNDLE_VERIFIER_SHA256: b07f9dee54862969fe90ef438c357a3445a9fe9574b69a9f87440e3ed9920300
      NOTEAI_V9_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v9.py
      NOTEAI_V9_BUNDLE_VERIFIER_SHA256: a69103e899dc74b4d34e4837e29f40284be9b252281fed262a2dd1afee3d6032
      NOTEAI_V10_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v10.py
      NOTEAI_V10_BUNDLE_VERIFIER_SHA256: 77c2410406448998c81d09b04d93d12db1cb3a4a032a0b78d9fc25626014758f
      NOTEAI_V13_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v13.py
      NOTEAI_V13_BUNDLE_VERIFIER_SHA256: c9a0f130879f8381ea94584a600b3ee388b91d380c079ec0b5efa145bff8b2d9
      NOTEAI_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v17.py
      NOTEAI_BUNDLE_VERIFIER_SHA256: d25fc0ea403b12f87810dd12d9bcdd304ed6e73730873a980782d621293e9402
      NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: tools/verify_admin_dependency_cache_transient_state_v17.py
      NOTEAI_TRANSIENT_STATE_VERIFIER_SHA256: 967e3545b6ca080574d33c137d77e89449dd6affc3a48473bbc460f8dfbf7e20
      NOTEAI_CLEANUP_HELPER_PATH: scripts/ci/cleanup_admin_dependency_cache_v5.sh
      NOTEAI_CLEANUP_HELPER_SHA256: a291c7242a0ac343faca19a921b2ad056d212aa2ef175a6b58b33ef028bbf239
      NOTEAI_DOWNLOAD_HELPER_PATH: scripts/ci/download_admin_dependency_cache_artifact.sh
      NOTEAI_DOWNLOAD_HELPER_SHA256: 66abfd513be7aa81946072493e1472030a8acccbf7a3e2d4dc461c94712e2a92
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH: tools/verify_admin_dependency_cache_provider_download.py
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_SHA256: ca05697d12b8c02b183b1c611c33781d63641c5369bc54b2508a538591a0986b
      NOTEAI_BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      NOTEAI_BUILDX_MODULE: github.com/docker/buildx
      NOTEAI_BUILDX_VERSION: v0.35.0
      NOTEAI_BUILDX_SOURCE_COMMIT: a319e5b15052cf6557ceb666eb8ff6e32380b782
      NOTEAI_BUILDKITD_FLAGS: "--allow-insecure-entitlement=network.host"
      RELEASE_COMMIT: 5335bdaed933b1f999b5f819c047ec50c11821ae
      RELEASE_TREE: 38e574e56406ba3380acb78edbe784508cc537cd
      NOTEAI_OCI_SOURCE: "https://github.com/iamyusen1314/noteai"
      NOTEAI_OCI_VERSION: "git-5335bda-amd64-r1"
      NOTEAI_OCI_CREATED: "2026-07-30T13:29:02Z"
      NOTEAI_ARTIFACT_NAME: "admin-dependency-prefix-cache-5335bda-v2"
      NOTEAI_PRODUCER_BUILDER: noteai-admin-cache-v5-producer-${{ github.run_id }}
      NOTEAI_CONSUMER_BUILDER: noteai-admin-cache-v5-consumer-${{ github.run_id }}
      NOTEAI_PRE_CLEANUP_BUDGET_SECONDS: "5700"
      NOTEAI_CLEANUP_BUDGET_SECONDS: "6300"
      NOTEAI_SETUP_CALL_MAX_SECONDS: "300"
      NOTEAI_EXPORT_CALL_MAX_SECONDS: "3600"
      NOTEAI_IMPORT_CALL_MAX_SECONDS: "900"
      NOTEAI_CLEANUP_COMMAND_TIMEOUT_SECONDS: "15"
      BUILDX_METADATA_PROVENANCE: max
      BUILDKIT_NO_CLIENT_TOKEN: "1"

    steps:
      - name: Initialize V17 bounded job deadlines
        shell: bash
        run: |
          set -euo pipefail
          command -v timeout >/dev/null
          job_control_epoch="$(date +%s)"
          test "${NOTEAI_PRE_CLEANUP_BUDGET_SECONDS}" = "5700"
          test "${NOTEAI_CLEANUP_BUDGET_SECONDS}" = "6300"
          test "${NOTEAI_SETUP_CALL_MAX_SECONDS}" = "300"
          test "${NOTEAI_EXPORT_CALL_MAX_SECONDS}" = "3600"
          test "${NOTEAI_IMPORT_CALL_MAX_SECONDS}" = "900"
          test "${NOTEAI_CLEANUP_COMMAND_TIMEOUT_SECONDS}" = "15"
          printf 'NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH=%s\n' \
            "$((job_control_epoch + NOTEAI_PRE_CLEANUP_BUDGET_SECONDS))" \
            >> "${GITHUB_ENV}"
          printf 'NOTEAI_CLEANUP_DEADLINE_EPOCH=%s\n' \
            "$((job_control_epoch + NOTEAI_CLEANUP_BUDGET_SECONDS))" \
            >> "${GITHUB_ENV}"

      - name: Checkout V17 one-shot controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Resolve C17-anchored V17 activation request
        id: control
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_NAME}" = "codex/quality-stabilization-real-chain"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"

          parent_record="$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          read -r -a parent_fields <<<"${parent_record}"
          test "${#parent_fields[@]}" -eq 2
          test "${parent_fields[0]}" = "${GITHUB_SHA}"
          controller_parent="$(git rev-parse "${GITHUB_SHA}^")"

          changed_file_list="${RUNNER_TEMP}/noteai-cache-v17-changed-files"
          git diff-tree --no-commit-id --no-renames --name-only -z -r "${controller_parent}" "${GITHUB_SHA}" > "${changed_file_list}"
          changed_files=()
          while IFS= read -r -d '' changed_file; do
            changed_files+=("${changed_file}")
          done < "${changed_file_list}"
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "${NOTEAI_REQUEST_PATH}"
          test "$(git diff-tree --no-commit-id --no-renames --diff-filter=A --name-only -r "${controller_parent}" "${GITHUB_SHA}" -- "${NOTEAI_REQUEST_PATH}")" = "${NOTEAI_REQUEST_PATH}"
          test "$(git ls-tree "${GITHUB_SHA}" -- "${NOTEAI_REQUEST_PATH}" | awk '{print $1 " " $2}')" = "100644 blob"

          git cat-file -e "${NOTEAI_C17_DATA_PLANE_ANCHOR}^{commit}"
          git merge-base --is-ancestor "${NOTEAI_C17_DATA_PLANE_ANCHOR}" "${controller_parent}"
          anchored_runtime_paths=(
            "${NOTEAI_EXPORT_HELPER_PATH}"
            "${NOTEAI_IMPORT_HELPER_PATH}"
            "${NOTEAI_V17_CACHE_IDENTITY_SOURCE_PROJECTION_PATH}"
            "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V3_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V6_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V7_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V8_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V9_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V10_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V13_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_BUNDLE_VERIFIER_PATH}"
            "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}"
            "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}"
            "${NOTEAI_CLEANUP_HELPER_PATH}"
          )
          for anchored_path in "${anchored_runtime_paths[@]}"; do
            test "$(git ls-tree "${NOTEAI_C17_DATA_PLANE_ANCHOR}" -- "${anchored_path}" | awk '{print $1 " " $2}')" = "100644 blob"
            anchor_blob="$(git rev-parse "${NOTEAI_C17_DATA_PLANE_ANCHOR}:${anchored_path}")"
            test "$(git rev-parse "${controller_parent}:${anchored_path}")" = "${anchor_blob}"
            test "$(git rev-parse "${GITHUB_SHA}:${anchored_path}")" = "${anchor_blob}"
          done

          check_c17_sha256() {
            local expected="$1"
            local path="$2"
            test "$(git show "${NOTEAI_C17_DATA_PLANE_ANCHOR}:${path}" | sha256sum | awk '{print $1}')" = "${expected}"
            test "$(sha256sum "${path}" | awk '{print $1}')" = "${expected}"
          }
          check_c17_sha256 "${NOTEAI_EXPORT_HELPER_SHA256}" "${NOTEAI_EXPORT_HELPER_PATH}"
          check_c17_sha256 "${NOTEAI_IMPORT_HELPER_SHA256}" "${NOTEAI_IMPORT_HELPER_PATH}"
          check_c17_sha256 "${NOTEAI_V17_CACHE_IDENTITY_SOURCE_PROJECTION_SHA256}" "${NOTEAI_V17_CACHE_IDENTITY_SOURCE_PROJECTION_PATH}"
          check_c17_sha256 "${NOTEAI_BASE_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V3_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_V3_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V6_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_V6_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V7_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_V7_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V8_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_V8_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V9_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_V9_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V10_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_V10_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V13_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_V13_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_BUNDLE_VERIFIER_SHA256}" "${NOTEAI_BUNDLE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_V4_TRANSIENT_VERIFIER_SHA256}" "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_TRANSIENT_STATE_VERIFIER_SHA256}" "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}"
          check_c17_sha256 "${NOTEAI_CLEANUP_HELPER_SHA256}" "${NOTEAI_CLEANUP_HELPER_PATH}"

          template_copy="${RUNNER_TEMP}/noteai-cache-v17-template.json"
          expected_request="${RUNNER_TEMP}/noteai-cache-v17-request.json"
          git show "${controller_parent}:${NOTEAI_REQUEST_TEMPLATE}" > "${template_copy}"
          test "$(sha256sum "${template_copy}" | awk '{print $1}')" = "${NOTEAI_REQUEST_TEMPLATE_SHA256}"
          test "$(grep -o '__DIRECT_PARENT_COMMIT__' "${template_copy}" | wc -l | tr -d ' ')" = "1"
          sed "s/__DIRECT_PARENT_COMMIT__/${controller_parent}/" "${template_copy}" > "${expected_request}"
          cmp -- "${expected_request}" "${NOTEAI_REQUEST_PATH}"
          jq -e --arg parent "${controller_parent}" --arg c17 "${NOTEAI_C17_DATA_PLANE_ANCHOR}" '
            .plan_checkpoint_commit == $parent
            and .release_commit == "5335bdaed933b1f999b5f819c047ec50c11821ae"
            and .control_plane == {
              activation_request_addition_count: 1,
              activation_request_mode: "100644",
              custom_ledger_required: false,
              custom_receipt_required: false,
              custom_topology_required: false,
              data_plane_anchor_commit: $c17,
              data_plane_anchor_kind: "C17_IMMUTABLE_DATA_PLANE",
              native_acceptance_evidence: [
                "github_workflow_run_id",
                "c17_commit_sha",
                "artifact_digest",
                "fresh_builder_import_success"
              ]
            }
            and .github_actions_maximum_run_count == 1
            and .github_actions_maximum_runtime_minutes == 120
            and .artifact_retention_days == 1
            and .dependency_cache_export_authorized == true
            and .registry_publication_authorized == false
            and .deployment_authorized == false
            and .database_authorized == false
            and .service_mutation_authorized == false
            and .public_traffic_authorized == false
          ' "${NOTEAI_REQUEST_PATH}" >/dev/null
          request_sha256="$(sha256sum "${NOTEAI_REQUEST_PATH}" | awk '{print $1}')"

          request_history_file="${RUNNER_TEMP}/noteai-cache-v17-request-history"
          git log --full-history --no-renames --diff-filter=A --format=%H "${GITHUB_SHA}" -- "${NOTEAI_REQUEST_PATH}" > "${request_history_file}"
          request_add_commits=()
          while IFS= read -r request_add_commit; do
            if [[ -n "${request_add_commit}" ]]; then
              request_add_commits+=("${request_add_commit}")
            fi
          done < "${request_history_file}"
          test "${#request_add_commits[@]}" -eq 1
          test "${request_add_commits[0]}" = "${GITHUB_SHA}"

          PYTHONDONTWRITEBYTECODE=1 python3 tools/verify_admin_dependency_cache_export_plan_v17.py >/dev/null
          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          test "$(git rev-parse "${RELEASE_COMMIT}^{tree}")" = "${RELEASE_TREE}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" "${controller_parent}"

          export_helper_copy="${RUNNER_TEMP}/noteai-cache-v17-export.sh"
          import_helper_copy="${RUNNER_TEMP}/noteai-cache-v17-import-base.sh"
          base_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-base.py"
          v3_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-v3.py"
          v6_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-v6.py"
          v7_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-v7.py"
          v8_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-v8.py"
          v9_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-v9.py"
          v10_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-v10.py"
          v13_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle-v13.py"
          bundle_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-bundle.py"
          v4_transient_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-transient-v4-base.py"
          transient_verifier_copy="${RUNNER_TEMP}/noteai-cache-v17-transient.py"
          cleanup_helper_copy="${RUNNER_TEMP}/noteai-cache-v17-cleanup.sh"
          source_identity_fixture_copy="${RUNNER_TEMP}/noteai-cache-v17-git-identity-source.json"
          cp "${NOTEAI_EXPORT_HELPER_PATH}" "${export_helper_copy}"
          cp "${NOTEAI_IMPORT_HELPER_PATH}" "${import_helper_copy}"
          cp "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}" "${base_verifier_copy}"
          cp "${NOTEAI_V3_BUNDLE_VERIFIER_PATH}" "${v3_verifier_copy}"
          cp "${NOTEAI_V6_BUNDLE_VERIFIER_PATH}" "${v6_verifier_copy}"
          cp "${NOTEAI_V7_BUNDLE_VERIFIER_PATH}" "${v7_verifier_copy}"
          cp "${NOTEAI_V8_BUNDLE_VERIFIER_PATH}" "${v8_verifier_copy}"
          cp "${NOTEAI_V9_BUNDLE_VERIFIER_PATH}" "${v9_verifier_copy}"
          cp "${NOTEAI_V10_BUNDLE_VERIFIER_PATH}" "${v10_verifier_copy}"
          cp "${NOTEAI_V13_BUNDLE_VERIFIER_PATH}" "${v13_verifier_copy}"
          cp "${NOTEAI_BUNDLE_VERIFIER_PATH}" "${bundle_verifier_copy}"
          cp "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" "${v4_transient_verifier_copy}"
          cp "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" "${transient_verifier_copy}"
          cp "${NOTEAI_CLEANUP_HELPER_PATH}" "${cleanup_helper_copy}"
          cp "${NOTEAI_V17_CACHE_IDENTITY_SOURCE_PROJECTION_PATH}" "${source_identity_fixture_copy}"
          chmod 0500 "${export_helper_copy}" "${import_helper_copy}" "${base_verifier_copy}" "${v3_verifier_copy}" "${v6_verifier_copy}" "${v7_verifier_copy}" "${v8_verifier_copy}" "${v9_verifier_copy}" "${v10_verifier_copy}" "${v13_verifier_copy}" "${bundle_verifier_copy}" "${v4_transient_verifier_copy}" "${transient_verifier_copy}" "${cleanup_helper_copy}"
          chmod 0400 "${source_identity_fixture_copy}"
          workflow_sha256="$(sha256sum "${NOTEAI_WORKFLOW_PATH}" | awk '{print $1}')"

          echo "plan_checkpoint_commit=${controller_parent}" >> "${GITHUB_OUTPUT}"
          echo "control_commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "request_sha256=${request_sha256}" >> "${GITHUB_OUTPUT}"
          echo "export_helper_copy=${export_helper_copy}" >> "${GITHUB_OUTPUT}"
          echo "import_helper_copy=${import_helper_copy}" >> "${GITHUB_OUTPUT}"
          echo "base_verifier_copy=${base_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v3_verifier_copy=${v3_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v6_verifier_copy=${v6_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v7_verifier_copy=${v7_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v8_verifier_copy=${v8_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v9_verifier_copy=${v9_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v10_verifier_copy=${v10_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v13_verifier_copy=${v13_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "bundle_verifier_copy=${bundle_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "v4_transient_verifier_copy=${v4_transient_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "transient_verifier_copy=${transient_verifier_copy}" >> "${GITHUB_OUTPUT}"
          echo "cleanup_helper_copy=${cleanup_helper_copy}" >> "${GITHUB_OUTPUT}"
          echo "source_identity_fixture_copy=${source_identity_fixture_copy}" >> "${GITHUB_OUTPUT}"
          echo "workflow_sha256=${workflow_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Checkout exact 5335 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify immutable dependency-prefix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          test "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}"
          test -z "$(git status --short)"
          test "$(
            sha256sum Dockerfile | awk '{print $1}'
          )" = "ed6282c422dde6e49c33da877bccf735dfbb19e29a834930fb2a1a52ef21b447"
          test "$(
            sha256sum .dockerignore | awk '{print $1}'
          )" = "d327ca46e4800b2af3c073c7e40bac93e0a042fec016fe6b798a5bd6944d3149"
          test "$(
            sha256sum model/requirements.txt | awk '{print $1}'
          )" = "1ef4150536e98b8057069981b1aadb469ca12f0f30f188a291af2f31e238724a"
          test "$(
            sha256sum model/requirements-api.txt | awk '{print $1}'
          )" = "0231c534fc2ca1ca503f5b29e19c503be995672cf20afd8203e207ffc8354ea9"
          if grep -Eq -- \
            '--allow[[:space:]]+network\.host|--allow=network\.host|--network=host|--network[[:space:]]+host' \
            Dockerfile \
            "${{ steps.control.outputs.export_helper_copy }}" \
            "${{ steps.control.outputs.import_helper_copy }}"
          then
            echo "build-level host network request is forbidden" >&2
            exit 1
          fi

      - name: Create isolated V17 producer and consumer builders
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          test "${NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH}" -lt \
            "${NOTEAI_CLEANUP_DEADLINE_EPOCH}"
          test "${NOTEAI_PRODUCER_BUILDER}" != "${NOTEAI_CONSUMER_BUILDER}"
          buildx_identity="$(
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker buildx version
          )"
          read -r \
            buildx_module \
            buildx_version \
            buildx_commit \
            buildx_extra \
            <<<"${buildx_identity}"
          test "${buildx_module}" = "${NOTEAI_BUILDX_MODULE}"
          test "${buildx_version}" = "${NOTEAI_BUILDX_VERSION}"
          test "${#buildx_commit}" -ge 7
          test "${#buildx_commit}" -le 40
          test "${NOTEAI_BUILDX_SOURCE_COMMIT:0:${#buildx_commit}}" = \
            "${buildx_commit}"
          test -z "${buildx_extra}"
          test ! -e "${DOCKER_CONFIG}"
          test ! -e "${BUILDX_CONFIG}"
          mkdir -m 0700 "${DOCKER_CONFIG}"
          mkdir -m 0700 "${BUILDX_CONFIG}"
          jq -n '{auths: {}}' > "${DOCKER_CONFIG}/config.json"
          chmod 0600 "${DOCKER_CONFIG}/config.json"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build
          images_before="${RUNNER_TEMP}/noteai-images-before"
          containers_before="${RUNNER_TEMP}/noteai-containers-before"
          volumes_before="${RUNNER_TEMP}/noteai-volumes-before"
          networks_before="${RUNNER_TEMP}/noteai-networks-before"
          baseline_marker="${RUNNER_TEMP}/noteai-docker-baseline-v5.complete"
          for baseline_path in \
            "${images_before}" \
            "${containers_before}" \
            "${volumes_before}" \
            "${networks_before}" \
            "${images_before}.tmp" \
            "${containers_before}.tmp" \
            "${volumes_before}.tmp" \
            "${networks_before}.tmp" \
            "${baseline_marker}" \
            "${baseline_marker}.tmp"
          do
            test ! -e "${baseline_path}"
            test ! -L "${baseline_path}"
          done
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker image ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${images_before}.tmp"
          chmod 0600 "${images_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker container ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${containers_before}.tmp"
          chmod 0600 "${containers_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker volume ls --quiet |
            LC_ALL=C sort -u > "${volumes_before}.tmp"
          chmod 0600 "${volumes_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker network ls --no-trunc --quiet |
            LC_ALL=C sort -u > "${networks_before}.tmp"
          chmod 0600 "${networks_before}.tmp"
          mv -- "${images_before}.tmp" "${images_before}"
          mv -- "${containers_before}.tmp" "${containers_before}"
          mv -- "${volumes_before}.tmp" "${volumes_before}"
          mv -- "${networks_before}.tmp" "${networks_before}"
          printf 'noteai-docker-baseline-v5=complete\n' \
            > "${baseline_marker}.tmp"
          chmod 0600 "${baseline_marker}.tmp"
          mv -- "${baseline_marker}.tmp" "${baseline_marker}"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker buildx create \
            --name "${NOTEAI_PRODUCER_BUILDER}" \
            --driver docker-container \
            --driver-opt "image=${NOTEAI_BUILDKIT_IMAGE}" \
            --driver-opt "provenance-add-gha=false" \
            --buildkitd-flags "${NOTEAI_BUILDKITD_FLAGS}"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker buildx create \
            --name "${NOTEAI_CONSUMER_BUILDER}" \
            --driver docker-container \
            --driver-opt "image=${NOTEAI_BUILDKIT_IMAGE}" \
            --driver-opt "provenance-add-gha=false" \
            --buildkitd-flags "${NOTEAI_BUILDKITD_FLAGS}"
          for builder_name in \
            "${NOTEAI_PRODUCER_BUILDER}" \
            "${NOTEAI_CONSUMER_BUILDER}"
          do
            builder_inspect="${RUNNER_TEMP}/${builder_name}-inspect"
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker buildx inspect "${builder_name}" --bootstrap \
              > "${builder_inspect}"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*Driver[[:space:]]*$/ {
                  value = $2
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "docker-container"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*BuildKit version[[:space:]]*$/ {
                  value = $2
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "v0.31.2"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*BuildKit daemon flags[[:space:]]*$/ {
                  value = substr($0, index($0, ":") + 1)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "${NOTEAI_BUILDKITD_FLAGS}"
            grep -Eq \
              '^[[:space:]]*Platforms:[[:space:]]+linux/amd64(,|$)' \
              "${builder_inspect}"
            container_name="buildx_buildkit_${builder_name}0"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.Name}}' "${container_name}"
            )" = "/${container_name}"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.State.Running}}' "${container_name}"
            )" = "true"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.Config.Image}}' "${container_name}"
            )" = "${NOTEAI_BUILDKIT_IMAGE}"
            if ! run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker exec "${container_name}" sh -eu -c '
              root=/etc/buildkit/provenance.d
              [ ! -L "${root}" ] || exit 41
              [ ! -e "${root}" ] || [ -d "${root}" ] || exit 41
              for candidate in \
                "${root}"/*.json \
                "${root}"/.json \
                "${root}"/.[!.]*.json \
                "${root}"/..json \
                "${root}"/..*.json \
                "${root}"/..?*.json
              do
                if [ -e "${candidate}" ] || [ -L "${candidate}" ]; then
                  exit 41
                fi
              done
            ' </dev/null >/dev/null 2>&1
            then
              echo "BuildKit provenance drop-in gate failed" >&2
              exit 1
            fi
            rm -f -- "${builder_inspect}"
          done
          echo "admin_dependency_cache_buildkit_provenance_dropins=ABSENT builders=2"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build

      - name: Export V17 dependency-only BuildKit local cache
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v17
          NOTEAI_PLAN_CHECKPOINT_COMMIT: ${{ steps.control.outputs.plan_checkpoint_commit }}
          NOTEAI_CONTROL_COMMIT: ${{ steps.control.outputs.control_commit }}
          NOTEAI_REQUEST_SHA256: ${{ steps.control.outputs.request_sha256 }}
          NOTEAI_WORKFLOW_SHA256: ${{ steps.control.outputs.workflow_sha256 }}
          NOTEAI_EXPORT_HELPER_PATH: ${{ steps.control.outputs.export_helper_copy }}
          NOTEAI_IMPORT_HELPER_PATH: ${{ steps.control.outputs.import_helper_copy }}
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_V3_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v3_verifier_copy }}
          NOTEAI_V6_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v6_verifier_copy }}
          NOTEAI_V7_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v7_verifier_copy }}
          NOTEAI_V8_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v8_verifier_copy }}
          NOTEAI_V9_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v9_verifier_copy }}
          NOTEAI_V10_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v10_verifier_copy }}
          NOTEAI_V13_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v13_verifier_copy }}
          NOTEAI_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
          NOTEAI_SOURCE_IDENTITY_FIXTURE_PATH: ${{ steps.control.outputs.source_identity_fixture_copy }}
          NOTEAI_SOURCE_IDENTITY_FIXTURE_SHA256: ${{ env.NOTEAI_V17_CACHE_IDENTITY_SOURCE_PROJECTION_SHA256 }}
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          test -z "$(git status --short)"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build
          export_rc=0
          run_before_cleanup_deadline \
            "${NOTEAI_EXPORT_CALL_MAX_SECONDS}" \
            "${NOTEAI_EXPORT_HELPER_PATH}" || export_rc=$?
          if [[ "${export_rc}" -ne 0 ]]; then
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
              --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
              --runner-temp "${RUNNER_TEMP}" \
              --docker-config "${DOCKER_CONFIG}" \
              --buildx-config "${BUILDX_CONFIG}" \
              --phase cleanup-active
            exit "${export_rc}"
          fi
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          test -z "$(git status --short)"

      - name: Prove V17 import and external-cache-removed same-builder replay
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_IMPORT_MODE: ci_portability
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v17
          NOTEAI_SOURCE_DIR: ${{ github.workspace }}
          NOTEAI_BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
          NOTEAI_PRODUCER_BUILDER_NAME: ${{ env.NOTEAI_PRODUCER_BUILDER }}
          NOTEAI_IMPORT_EVIDENCE_DIR: ${{ runner.temp }}/unused-v17-import-evidence
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_V3_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v3_verifier_copy }}
          NOTEAI_V6_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v6_verifier_copy }}
          NOTEAI_V7_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v7_verifier_copy }}
          NOTEAI_V8_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v8_verifier_copy }}
          NOTEAI_V9_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v9_verifier_copy }}
          NOTEAI_V10_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v10_verifier_copy }}
          NOTEAI_V13_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v13_verifier_copy }}
          NOTEAI_TRUSTED_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
          NOTEAI_EXPECTED_IMPORT_HELPER_SHA256: ${{ env.NOTEAI_IMPORT_HELPER_SHA256 }}
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
          BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          import_rc=0
          run_before_cleanup_deadline \
            "${NOTEAI_IMPORT_CALL_MAX_SECONDS}" \
            bash "${{ steps.control.outputs.import_helper_copy }}" ||
            import_rc=$?
          if [[ "${import_rc}" -ne 0 ]]; then
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
              --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
              --runner-temp "${RUNNER_TEMP}" \
              --docker-config "${DOCKER_CONFIG}" \
              --buildx-config "${BUILDX_CONFIG}" \
              --phase cleanup-active
            exit "${import_rc}"
          fi
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/SHA256SUMS"
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/portability/proof.json"
          jq -e '
            .import.v11_rawjson_diagnostic.schema_version ==
              "noteai.admin-dependency-cache-v11-diagnostic.v1"
            and .import.v11_rawjson_diagnostic.verdict == "pass"
            and .import.v11_rawjson_diagnostic.projection_kind ==
              "import-observer-prefix"
            and .import.v11_rawjson_diagnostic.observer.network_mode ==
              "NONE"
            and .import.v11_rawjson_diagnostic.observer.marker_occurrence_count ==
              1
            and .pair.classification ==
              "SAME_SOURCE_COPY_PIP_DIGESTS_CACHED"
            and .cache_record.schema_version ==
              "noteai.admin-dependency-cache-record.v13"
            and .cache_record.result_bearing_record_count > 0
            and .cache_record.link_count > 0
            and .cache_record.structural_validation == {
              cache_config_validated: true,
              direct_identity_path_claimed: false,
              record_and_layer_dag_validated: true,
              record_and_layer_reachability_validated: true,
              runtime_portability_proven: false,
              vertex_digest_binding_attempted: false
            }
            and .external_cache_removed_same_consumer_builder_replay.v10_rawjson_diagnostic.projection_kind ==
              "full-runtime-common"
            and .external_cache_removed_same_consumer_builder_replay.v10_rawjson_diagnostic.full_post_pip_witness.runtime_pip_terminal ==
              false
            and .external_cache_removed_same_consumer_builder_replay.true_empty_cache_replay_claimed ==
              false
          ' "${NOTEAI_CACHE_BUNDLE_DIR}/portability/proof.json" >/dev/null

      - name: Remove V17 builders and all transient Docker state
        id: cleanup
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_CLEANUP_RECEIPT_PATH: ${{ runner.temp }}/noteai-admin-dependency-cache-cleanup-v5.json
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
          NOTEAI_CLEANUP_HELPER_PATH: ${{ steps.control.outputs.cleanup_helper_copy }}
        shell: bash
        run: |
          set -euo pipefail
          bash "${NOTEAI_CLEANUP_HELPER_PATH}"
          jq -e '
            type == "object"
            and keys == [
              "buildx_root_absent",
              "cleanup_effective",
              "client_token_disabled",
              "consumer_builder_absent",
              "consumer_builder_remove",
              "containers_parity",
              "deadline_control_valid",
              "diagnostic_files_absent",
              "docker_baseline_state",
              "docker_root_absent",
              "images_parity",
              "networks_parity",
              "new_images_remove",
              "overall_pass",
              "post_builder_state",
              "pre_state",
              "producer_builder_absent",
              "producer_builder_remove",
              "schema_version",
              "volumes_parity"
            ]
            and .schema_version == 2
            and .deadline_control_valid == true
            and .client_token_disabled == true
            and .docker_baseline_state == "pass"
            and .producer_builder_absent == "pass"
            and .consumer_builder_absent == "pass"
            and .images_parity == "pass"
            and .containers_parity == "pass"
            and .volumes_parity == "pass"
            and .networks_parity == "pass"
            and .docker_root_absent == "pass"
            and .buildx_root_absent == "pass"
            and .diagnostic_files_absent == "pass"
            and .cleanup_effective == true
            and .overall_pass == true
          ' "${NOTEAI_CLEANUP_RECEIPT_PATH}" >/dev/null
          printf 'cleanup_passed=true\n' >> "${GITHUB_OUTPUT}"

      - name: Validate final V17 portable bundle after cleanup
        id: bundle
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        env:
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v17
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_V3_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v3_verifier_copy }}
          NOTEAI_V6_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v6_verifier_copy }}
          NOTEAI_V7_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v7_verifier_copy }}
          NOTEAI_V8_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v8_verifier_copy }}
          NOTEAI_V9_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v9_verifier_copy }}
          NOTEAI_V10_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v10_verifier_copy }}
          NOTEAI_V13_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v13_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sums_sha256="$(
            tr -d '\r\n' < "${RUNNER_TEMP}/noteai-final-sums-sha256"
          )"
          test "$(
            printf '%s' "${expected_sums_sha256}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          jq -e '
            .archive.gzip_bytes <= .archive.maximum_gzip_bytes
            and .archive.maximum_gzip_bytes == 3758096384
          ' "${NOTEAI_CACHE_BUNDLE_DIR}/manifest.json" >/dev/null
          final_extract="${RUNNER_TEMP}/noteai-final-cache-v17-validation"
          python3 \
            "${{ steps.control.outputs.bundle_verifier_copy }}" \
            verify-final \
            --bundle "${NOTEAI_CACHE_BUNDLE_DIR}" \
            --extract-to "${final_extract}" \
            --expected-sums-sha256 "${expected_sums_sha256}" \
            --output "${RUNNER_TEMP}/noteai-final-bundle-v17-validation.json"
          jq -e '
            .artifact_input_bytes <= .artifact_input_maximum_bytes
            and .artifact_input_maximum_bytes == 4026531840
            and .artifact_provider_maximum_bytes == 4294967296
            and .pair_classification ==
              "SAME_SOURCE_COPY_PIP_DIGESTS_CACHED"
            and .true_empty_cache_replay_claimed == false
          ' "${RUNNER_TEMP}/noteai-final-bundle-v17-validation.json" >/dev/null
          portability_proof_sha256="$(
            jq -r '.portability_proof_sha256' \
              "${RUNNER_TEMP}/noteai-final-bundle-v17-validation.json"
          )"
          test "$(
            printf '%s' "${portability_proof_sha256}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          echo "fresh_builder_import_succeeded=true" >> "${GITHUB_OUTPUT}"
          echo "portability_proof_sha256=${portability_proof_sha256}" \
            >> "${GITHUB_OUTPUT}"
          rm -rf --one-file-system -- "${final_extract}"
          test ! -e "${final_extract}"
          printf 'final_sums_sha256=%s\n' "${expected_sums_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload one-day V17 public-repository dependency cache artifact
        id: upload
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.NOTEAI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v17
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

      - name: Confirm V17 native acceptance evidence
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(
            printf '%s' "${GITHUB_RUN_ID}" | grep -Ec '^[1-9][0-9]*$'
          )" = "1"
          test "${NOTEAI_C17_DATA_PLANE_ANCHOR}" = \
            "7ee9a15425c38e8f0d5382cba488bd4a6ce92d6e"
          test -n "${{ steps.upload.outputs.artifact-id }}"
          test "$(
            printf '%s' "${{ steps.upload.outputs.artifact-digest }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          test "${{ steps.bundle.outputs.fresh_builder_import_succeeded }}" = \
            "true"
          test "$(
            printf '%s' \
              "${{ steps.bundle.outputs.portability_proof_sha256 }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          test "$(
            printf '%s' "${{ steps.bundle.outputs.final_sums_sha256 }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          echo "workflow_run_id=${GITHUB_RUN_ID} c17_commit_sha=${NOTEAI_C17_DATA_PLANE_ANCHOR} artifact_digest=${{ steps.upload.outputs.artifact-digest }} fresh_builder_import_succeeded=true fresh_builder_import_proof_sha256=${{ steps.bundle.outputs.portability_proof_sha256 }}"

      - name: Remove runner-local V17 bundle
        if: always()
        env:
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v17
          NOTEAI_CLEANUP_RECEIPT_PATH: ${{ runner.temp }}/noteai-admin-dependency-cache-cleanup-v5.json
        shell: bash
        run: |
          set -euo pipefail
          test "${NOTEAI_CACHE_BUNDLE_DIR}" = \
            "${RUNNER_TEMP}/noteai-admin-dependency-cache-bundle-v17"
          test ! -L "${NOTEAI_CACHE_BUNDLE_DIR}"
          if [[ -e "${NOTEAI_CACHE_BUNDLE_DIR}" ]]; then
            rm -rf --one-file-system -- "${NOTEAI_CACHE_BUNDLE_DIR}"
          fi
          test ! -e "${NOTEAI_CACHE_BUNDLE_DIR}"
          test "${NOTEAI_CLEANUP_RECEIPT_PATH}" = \
            "${RUNNER_TEMP}/noteai-admin-dependency-cache-cleanup-v5.json"
          test ! -L "${NOTEAI_CLEANUP_RECEIPT_PATH}"
          rm -f -- "${NOTEAI_CLEANUP_RECEIPT_PATH}"
          test ! -e "${NOTEAI_CLEANUP_RECEIPT_PATH}"
