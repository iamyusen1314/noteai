      NOTEAI_DOWNLOAD_HELPER_PATH: scripts/ci/download_admin_dependency_cache_artifact.sh
      NOTEAI_DOWNLOAD_HELPER_SHA256: 66abfd513be7aa81946072493e1472030a8acccbf7a3e2d4dc461c94712e2a92
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH: tools/verify_admin_dependency_cache_provider_download.py
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_SHA256: ca05697d12b8c02b183b1c611c33781d63641c5369bc54b2508a538591a0986b
      NOTEAI_BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      NOTEAI_BUILDX_MODULE: github.com/docker/buildx
      NOTEAI_BUILDX_VERSION: v0.35.0
      NOTEAI_BUILDX_SOURCE_COMMIT: a319e5b15052cf6557ceb666eb8ff6e32380b782
      NOTEAI_BUILDKITD_FLAGS: "--allow-insecure-entitlement=network.host"
      RELEASE_COMMIT: 5335bdaed933b1f999b5f819c047ec50c11821ae
      RELEASE_TREE: 38e574e56406ba3380acb78edbe784508cc537cd
      NOTEAI_OCI_SOURCE: "https://github.com/iamyusen1314/noteai"
      NOTEAI_OCI_VERSION: "git-5335bda-amd64-r1"
      NOTEAI_OCI_CREATED: "2026-07-30T13:29:02Z"
      NOTEAI_ARTIFACT_NAME: "admin-dependency-prefix-cache-5335bda-v2"
      NOTEAI_PRODUCER_BUILDER: noteai-admin-cache-v5-producer-${{ github.run_id }}
      NOTEAI_CONSUMER_BUILDER: noteai-admin-cache-v5-consumer-${{ github.run_id }}
      NOTEAI_PRE_CLEANUP_BUDGET_SECONDS: "5700"
      NOTEAI_CLEANUP_BUDGET_SECONDS: "6300"
      NOTEAI_SETUP_CALL_MAX_SECONDS: "300"
      NOTEAI_RUN_LEDGER_BUDGET_SECONDS: "60"
      NOTEAI_RUN_LEDGER_CALL_MAX_SECONDS: "15"
      NOTEAI_RUN_LEDGER_CONNECT_TIMEOUT_SECONDS: "5"
      NOTEAI_RUN_LEDGER_MAX_OBSERVATIONS: "6"
      NOTEAI_RUN_LEDGER_PAGE_MAXIMUM: "10"
      NOTEAI_RUN_LEDGER_POLL_SECONDS: "5"
      NOTEAI_RUN_LEDGER_RETRY_DELAY_SECONDS: "1"
      NOTEAI_RUN_LEDGER_RETRY_MAXIMUM: "2"
      NOTEAI_EXPORT_CALL_MAX_SECONDS: "3600"
      NOTEAI_IMPORT_CALL_MAX_SECONDS: "900"
      NOTEAI_CLEANUP_COMMAND_TIMEOUT_SECONDS: "15"
      BUILDX_METADATA_PROVENANCE: max
      BUILDKIT_NO_CLIENT_TOKEN: "1"

    steps:
      - name: Initialize V10 bounded job deadlines
        shell: bash
        run: |
          set -euo pipefail
          command -v timeout >/dev/null
          job_control_epoch="$(date +%s)"
          test "${NOTEAI_PRE_CLEANUP_BUDGET_SECONDS}" = "5700"
          test "${NOTEAI_CLEANUP_BUDGET_SECONDS}" = "6300"
          test "${NOTEAI_SETUP_CALL_MAX_SECONDS}" = "300"
          test "${NOTEAI_RUN_LEDGER_BUDGET_SECONDS}" = "60"
          test "${NOTEAI_RUN_LEDGER_CALL_MAX_SECONDS}" = "15"
          test "${NOTEAI_RUN_LEDGER_CONNECT_TIMEOUT_SECONDS}" = "5"
          test "${NOTEAI_RUN_LEDGER_MAX_OBSERVATIONS}" = "6"
          test "${NOTEAI_RUN_LEDGER_PAGE_MAXIMUM}" = "10"
          test "${NOTEAI_RUN_LEDGER_POLL_SECONDS}" = "5"
          test "${NOTEAI_RUN_LEDGER_RETRY_DELAY_SECONDS}" = "1"
          test "${NOTEAI_RUN_LEDGER_RETRY_MAXIMUM}" = "2"
          test "${NOTEAI_EXPORT_CALL_MAX_SECONDS}" = "3600"
          test "${NOTEAI_IMPORT_CALL_MAX_SECONDS}" = "900"
          test "${NOTEAI_CLEANUP_COMMAND_TIMEOUT_SECONDS}" = "15"
          printf 'NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH=%s\n' \
            "$((job_control_epoch + NOTEAI_PRE_CLEANUP_BUDGET_SECONDS))" \
            >> "${GITHUB_ENV}"
          printf 'NOTEAI_CLEANUP_DEADLINE_EPOCH=%s\n' \
            "$((job_control_epoch + NOTEAI_CLEANUP_BUDGET_SECONDS))" \
            >> "${GITHUB_ENV}"

      - name: Checkout V10 one-shot controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Prove this is the unique V10 workflow run for the branch lifecycle
        shell: bash
        env:
          NOTEAI_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_NAME}" = "codex/quality-stabilization-real-chain"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${NOTEAI_ACTIONS_READ_TOKEN}"
          command -v curl >/dev/null
          command -v jq >/dev/null

          run_ledger="${RUNNER_TEMP}/noteai-cache-v10-run-ledger"
          response="${RUNNER_TEMP}/noteai-cache-v10-run-page.json"
          ledger_now="$(date +%s)"
          ledger_deadline="$((ledger_now + NOTEAI_RUN_LEDGER_BUDGET_SECONDS))"
          if (( ledger_deadline > NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH )); then
            ledger_deadline="${NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH}"
          fi
          ledger_verified="false"
          for ((
            observation = 1;
            observation <= NOTEAI_RUN_LEDGER_MAX_OBSERVATIONS;
            observation++
          )); do
            : > "${run_ledger}"
            ledger_total=""
            ledger_complete="false"
            for ((
              page = 1;
              page <= NOTEAI_RUN_LEDGER_PAGE_MAXIMUM;
              page++
            )); do
              ledger_remaining="$((ledger_deadline - $(date +%s)))"
              (( ledger_remaining > 0 ))
              ledger_call_timeout="${NOTEAI_RUN_LEDGER_CALL_MAX_SECONDS}"
              if (( ledger_call_timeout > ledger_remaining )); then
                ledger_call_timeout="${ledger_remaining}"
              fi
              curl --fail-with-body --silent --show-error --location \
                --retry "${NOTEAI_RUN_LEDGER_RETRY_MAXIMUM}" \
                --retry-delay "${NOTEAI_RUN_LEDGER_RETRY_DELAY_SECONDS}" \
                --retry-max-time "${ledger_call_timeout}" \
                --connect-timeout \
                "${NOTEAI_RUN_LEDGER_CONNECT_TIMEOUT_SECONDS}" \
                --max-time "${ledger_call_timeout}" \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${NOTEAI_ACTIONS_READ_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --get \
                --data-urlencode "per_page=100" \
                --data-urlencode "page=${page}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/admin-dependency-cache-export-v10.yml/runs" \
                > "${response}"
              jq -e \
                --arg sha "${GITHUB_SHA}" \
                --arg branch "${GITHUB_REF_NAME}" \
                '
                  (.total_count | type == "number")
                  and .total_count >= 0
                  and .total_count <= 1000
                  and (.total_count | floor) == .total_count
                  and (.workflow_runs | type == "array")
                  and all(
                    .workflow_runs[];
                    (.id | type == "number")
                    and .id > 0
                    and (.run_attempt | type == "number")
                    and .run_attempt > 0
                    and .head_sha == $sha
                    and .head_branch == $branch
                    and .event == "push"
                  )
                ' "${response}" >/dev/null
              page_total="$(jq -r '.total_count' "${response}")"
              if [[ -z "${ledger_total}" ]]; then
                ledger_total="${page_total}"
                (( ledger_total <= 1 ))
              else
                test "${page_total}" = "${ledger_total}"
              fi
              jq -r \
                '.workflow_runs[] | [.id, .run_attempt, .head_sha, .event] | @tsv' \
                "${response}" >> "${run_ledger}"
              page_count="$(jq -r '.workflow_runs | length' "${response}")"
              if (( page_count < 100 )); then
                ledger_complete="true"
                break
              fi
            done
            test "${ledger_complete}" = "true"
            ledger_lines="$(wc -l < "${run_ledger}" | tr -d ' ')"
            test "${ledger_lines}" = "${ledger_total}"
            if [[ "${ledger_total}" = "1" ]]; then
              IFS=$'\t' read -r \
                ledger_run_id ledger_attempt ledger_sha ledger_event \
                < "${run_ledger}"
              test "${ledger_run_id}" = "${GITHUB_RUN_ID}"
              test "${ledger_attempt}" = "1"
              test "${ledger_sha}" = "${GITHUB_SHA}"
              test "${ledger_event}" = "push"
              ledger_verified="true"
              break
            fi
            test "${ledger_total}" = "0"
            if (( observation < NOTEAI_RUN_LEDGER_MAX_OBSERVATIONS )); then
              ledger_remaining="$((ledger_deadline - $(date +%s)))"
              (( ledger_remaining > NOTEAI_RUN_LEDGER_POLL_SECONDS ))
              sleep "${NOTEAI_RUN_LEDGER_POLL_SECONDS}"
            fi
          done
          test "${ledger_verified}" = "true"

      - name: Resolve exact V10 recovery request
        id: control
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_NAME}" = "codex/quality-stabilization-real-chain"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"

          parent_record="$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          read -r -a parent_fields <<<"${parent_record}"
          test "${#parent_fields[@]}" -eq 2
          test "${parent_fields[0]}" = "${GITHUB_SHA}"
          controller_parent="$(git rev-parse "${GITHUB_SHA}^")"

          changed_file_list="${RUNNER_TEMP}/noteai-cache-v10-changed-files"
          git diff-tree --no-commit-id --no-renames \
            --name-only -z -r "${controller_parent}" "${GITHUB_SHA}" \
            > "${changed_file_list}"
          changed_files=()
          while IFS= read -r -d '' changed_file; do
            changed_files+=("${changed_file}")
          done < "${changed_file_list}"
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "${NOTEAI_REQUEST_PATH}"
          test "$(
            git diff-tree --no-commit-id --no-renames --diff-filter=A \
              --name-status -r "${controller_parent}" "${GITHUB_SHA}" \
              -- "${NOTEAI_REQUEST_PATH}"
          )" = $'A\t'"${NOTEAI_REQUEST_PATH}"
          test "$(
            git ls-tree "${GITHUB_SHA}" -- "${NOTEAI_REQUEST_PATH}" |
              awk '{print $1 " " $2}'
          )" = "100644 blob"

          for reviewed_path in \
            "${NOTEAI_REQUEST_TEMPLATE}" \
            "${NOTEAI_V9_REQUEST_PATH}" \
            "${NOTEAI_V9_WORKFLOW_PATH}" \
            "${NOTEAI_V9_TEMPLATE_PATH}" \
            "${NOTEAI_V9_PLAN_VERIFIER_PATH}" \
            "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            "${NOTEAI_FAILURE_EVIDENCE_PATH}" \
            "${NOTEAI_FAILURE_EVIDENCE_VERIFIER_PATH}" \
            "${NOTEAI_V5_RAWJSON_SOURCE_PROJECTION_PATH}" \
            "${NOTEAI_V6_STRUCTURAL_SOURCE_PROJECTION_PATH}" \
            "${NOTEAI_V7_INCREMENTAL_SOURCE_PROJECTION_PATH}" \
            "${NOTEAI_V8_EMPTY_SOURCE_PROJECTION_PATH}" \
            "${NOTEAI_V9_VERTEX_INPUT_OMISSION_SOURCE_PROJECTION_PATH}" \
            "${NOTEAI_V10_CACHE_OBSERVER_SOURCE_PROJECTION_PATH}" \
            "${NOTEAI_EXPORT_HELPER_PATH}" \
            "${NOTEAI_IMPORT_HELPER_PATH}" \
            "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_V3_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_V6_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_V7_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_V8_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_V9_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            "${NOTEAI_CLEANUP_HELPER_PATH}" \
            "${NOTEAI_DOWNLOAD_HELPER_PATH}" \
            "${NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH}"
          do
            test "$(
              git rev-parse "${controller_parent}:${reviewed_path}"
            )" = "$(
              git rev-parse "${GITHUB_SHA}:${reviewed_path}"
            )"
          done

          check_parent_sha256() {
            local expected="$1"
            local path="$2"
            test "$(
              git show "${controller_parent}:${path}" |
                sha256sum |
                awk '{print $1}'
            )" = "${expected}"
          }
          check_parent_sha256 \
            "${NOTEAI_REQUEST_TEMPLATE_SHA256}" \
            "${NOTEAI_REQUEST_TEMPLATE}"
          check_parent_sha256 \
            "${NOTEAI_V9_REQUEST_SHA256}" \
            "${NOTEAI_V9_REQUEST_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V9_WORKFLOW_SHA256}" \
            "${NOTEAI_V9_WORKFLOW_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V9_TEMPLATE_SHA256}" \
            "${NOTEAI_V9_TEMPLATE_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V9_PLAN_VERIFIER_SHA256}" \
            "${NOTEAI_V9_PLAN_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V4_TRANSIENT_VERIFIER_SHA256}" \
            "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_FAILURE_EVIDENCE_SHA256}" \
            "${NOTEAI_FAILURE_EVIDENCE_PATH}"
          check_parent_sha256 \
            "${NOTEAI_FAILURE_EVIDENCE_VERIFIER_SHA256}" \
            "${NOTEAI_FAILURE_EVIDENCE_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V5_RAWJSON_SOURCE_PROJECTION_SHA256}" \
            "${NOTEAI_V5_RAWJSON_SOURCE_PROJECTION_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V6_STRUCTURAL_SOURCE_PROJECTION_SHA256}" \
            "${NOTEAI_V6_STRUCTURAL_SOURCE_PROJECTION_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V7_INCREMENTAL_SOURCE_PROJECTION_SHA256}" \
            "${NOTEAI_V7_INCREMENTAL_SOURCE_PROJECTION_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V8_EMPTY_SOURCE_PROJECTION_SHA256}" \
            "${NOTEAI_V8_EMPTY_SOURCE_PROJECTION_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V9_VERTEX_INPUT_OMISSION_SOURCE_PROJECTION_SHA256}" \
            "${NOTEAI_V9_VERTEX_INPUT_OMISSION_SOURCE_PROJECTION_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V10_CACHE_OBSERVER_SOURCE_PROJECTION_SHA256}" \
            "${NOTEAI_V10_CACHE_OBSERVER_SOURCE_PROJECTION_PATH}"
          check_parent_sha256 \
            "${NOTEAI_EXPORT_HELPER_SHA256}" \
            "${NOTEAI_EXPORT_HELPER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_IMPORT_HELPER_SHA256}" \
            "${NOTEAI_IMPORT_HELPER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_BASE_BUNDLE_VERIFIER_SHA256}" \
            "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}"
