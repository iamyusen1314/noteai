name: Admin dependency cache export

on:
  push:
    branches:
      - codex/quality-stabilization-real-chain
    paths:
      - .github/release-requests/admin-5335bda-dependency-cache-v2.json

permissions:
  contents: read

concurrency:
  group: admin-dependency-cache-export-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export-cache:
    name: Export and prove exact 5335 Admin dependency prefix cache
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      NOTEAI_REQUEST_PATH: .github/release-requests/admin-5335bda-dependency-cache-v2.json
      NOTEAI_REQUEST_TEMPLATE: deploy/production/plans/admin-dependency-cache-export-request-v2.json
      NOTEAI_REQUEST_TEMPLATE_SHA256: 331bd7a6dd93d3f714859ebfc2b537c60d911f6e1f1ba05adb0a05e30c254f57
      NOTEAI_EXPORT_HELPER_PATH: scripts/ci/export_admin_dependency_cache.sh
      NOTEAI_EXPORT_HELPER_SHA256: fabcdc2245c537c2fd56e88b6e0aced77d5c26234fc74d7d934b11ecda8d860c
      NOTEAI_IMPORT_HELPER_PATH: scripts/ci/import_admin_dependency_cache.sh
      NOTEAI_IMPORT_HELPER_SHA256: c4986143d5897140f72ad6835b44f7fc989830a30341cb4e3f5718fced3ca777
      NOTEAI_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle.py
      NOTEAI_BUNDLE_VERIFIER_SHA256: bf526c29b213dc15d257cb9aedc52790aa1dc9cf1f82bba0e6e85e41db3edf38
      NOTEAI_DOWNLOAD_HELPER_PATH: scripts/ci/download_admin_dependency_cache_artifact.sh
      NOTEAI_DOWNLOAD_HELPER_SHA256: 66abfd513be7aa81946072493e1472030a8acccbf7a3e2d4dc461c94712e2a92
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH: tools/verify_admin_dependency_cache_provider_download.py
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_SHA256: 943c294d92d2dea13d4cd3dc6396ea2522841634541562d2f22ef4d319c52b36
      RELEASE_COMMIT: 5335bdaed933b1f999b5f819c047ec50c11821ae
      RELEASE_TREE: 38e574e56406ba3380acb78edbe784508cc537cd
      NOTEAI_OCI_SOURCE: "https://github.com/iamyusen1314/noteai"
      NOTEAI_OCI_VERSION: "git-5335bda-amd64-r1"
      NOTEAI_OCI_CREATED: "2026-07-30T13:29:02Z"
      NOTEAI_ARTIFACT_NAME: "admin-dependency-prefix-cache-5335bda-v2"
      NOTEAI_PRODUCER_BUILDER: noteai-admin-cache-producer-${{ github.run_id }}
      NOTEAI_CONSUMER_BUILDER: noteai-admin-cache-consumer-${{ github.run_id }}
      BUILDX_METADATA_PROVENANCE: max

    steps:
      - name: Checkout one-shot controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Resolve exact one-shot cache request
        id: control
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_NAME}" = "codex/quality-stabilization-real-chain"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"

          parent_record="$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          read -r -a parent_fields <<<"${parent_record}"
          test "${#parent_fields[@]}" -eq 2
          test "${parent_fields[0]}" = "${GITHUB_SHA}"
          controller_parent="$(git rev-parse "${GITHUB_SHA}^")"

          changed_file_list="${RUNNER_TEMP}/noteai-cache-request-changed-files"
          git diff-tree --no-commit-id --no-renames \
            --name-only -z -r "${controller_parent}" "${GITHUB_SHA}" \
            > "${changed_file_list}"
          changed_files=()
          while IFS= read -r -d '' changed_file; do
            changed_files+=("${changed_file}")
          done < "${changed_file_list}"
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "${NOTEAI_REQUEST_PATH}"
          test "$(
            git diff-tree --no-commit-id --no-renames --diff-filter=A \
              --name-status -r "${controller_parent}" "${GITHUB_SHA}" \
              -- "${NOTEAI_REQUEST_PATH}"
          )" = $'A\t'"${NOTEAI_REQUEST_PATH}"
          test "$(
            git ls-tree "${GITHUB_SHA}" -- "${NOTEAI_REQUEST_PATH}" |
              awk '{print $1 " " $2}'
          )" = "100644 blob"

          for reviewed_path in \
            "${NOTEAI_REQUEST_TEMPLATE}" \
            "${NOTEAI_EXPORT_HELPER_PATH}" \
            "${NOTEAI_IMPORT_HELPER_PATH}" \
            "${NOTEAI_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_DOWNLOAD_HELPER_PATH}" \
            "${NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH}"
          do
            test "$(
              git rev-parse "${controller_parent}:${reviewed_path}"
            )" = "$(
              git rev-parse "${GITHUB_SHA}:${reviewed_path}"
            )"
          done
          test "$(
            git show "${controller_parent}:${NOTEAI_REQUEST_TEMPLATE}" |
              sha256sum |
              awk '{print $1}'
          )" = "${NOTEAI_REQUEST_TEMPLATE_SHA256}"
          test "$(
            git show "${controller_parent}:${NOTEAI_EXPORT_HELPER_PATH}" |
              sha256sum |
              awk '{print $1}'
          )" = "${NOTEAI_EXPORT_HELPER_SHA256}"
          test "$(
            git show "${controller_parent}:${NOTEAI_IMPORT_HELPER_PATH}" |
              sha256sum |
              awk '{print $1}'
          )" = "${NOTEAI_IMPORT_HELPER_SHA256}"
          test "$(
            git show "${controller_parent}:${NOTEAI_BUNDLE_VERIFIER_PATH}" |
              sha256sum |
              awk '{print $1}'
          )" = "${NOTEAI_BUNDLE_VERIFIER_SHA256}"
          test "$(
            git show "${controller_parent}:${NOTEAI_DOWNLOAD_HELPER_PATH}" |
              sha256sum |
              awk '{print $1}'
          )" = "${NOTEAI_DOWNLOAD_HELPER_SHA256}"
          test "$(
            git show "${controller_parent}:${NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH}" |
              sha256sum |
              awk '{print $1}'
          )" = "${NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_SHA256}"

          request_template="${RUNNER_TEMP}/noteai-cache-request-template.json"
          request_file="${RUNNER_TEMP}/noteai-admin-dependency-cache-request.json"
          expected_request="${RUNNER_TEMP}/noteai-cache-request-expected.json"
          git show "${controller_parent}:${NOTEAI_REQUEST_TEMPLATE}" \
            > "${request_template}"
          test "$(
            grep -o '__DIRECT_PARENT_COMMIT__' "${request_template}" |
              wc -l |
              tr -d ' '
          )" = "1"
          sed \
            "s/__DIRECT_PARENT_COMMIT__/${controller_parent}/" \
            "${request_template}" \
            > "${expected_request}"
          git show "${GITHUB_SHA}:${NOTEAI_REQUEST_PATH}" > "${request_file}"
          cmp "${request_file}" "${expected_request}"
          jq -e \
            --arg plan_checkpoint_commit "${controller_parent}" '
            type == "object"
            and
            (keys | sort) == [
              "artifact_input_maximum_bytes",
              "artifact_provider_maximum_bytes",
              "artifact_retention_days",
              "artifact_visibility_assumption",
              "cross_provider_transfer_authorized",
              "database_authorized",
              "dependency_cache_export_authorized",
              "deployment_authorized",
              "github_actions_maximum_runtime_minutes",
              "plan_checkpoint_commit",
              "public_repository_artifact_authorized",
              "public_traffic_authorized",
              "registry_publication_authorized",
              "release_commit",
              "release_scope",
              "schema_version",
              "service_mutation_authorized",
              "task",
              "trigger_mode"
            ]
            and .schema_version == 2
            and .task == "PROD-FIRST-LAUNCH-ADMIN-INTERNAL-001"
            and .release_commit == "5335bdaed933b1f999b5f819c047ec50c11821ae"
            and .plan_checkpoint_commit == $plan_checkpoint_commit
            and .release_scope == "admin_dependency_prefix_cache"
            and .trigger_mode == "one_shot_added_request_v2"
            and .github_actions_maximum_runtime_minutes == 120
            and .artifact_retention_days == 1
            and .artifact_input_maximum_bytes == 4026531840
            and .artifact_provider_maximum_bytes == 4294967296
            and .artifact_visibility_assumption == "public_repository_readers"
            and .dependency_cache_export_authorized == true
            and .public_repository_artifact_authorized == true
            and .cross_provider_transfer_authorized == true
            and .registry_publication_authorized == false
            and .deployment_authorized == false
            and .database_authorized == false
            and .service_mutation_authorized == false
            and .public_traffic_authorized == false
          ' "${request_file}" >/dev/null
          request_sha256="$(
            sha256sum "${request_file}" | awk '{print $1}'
          )"

          request_history_file="${RUNNER_TEMP}/noteai-cache-request-history"
          git log --diff-filter=A --format=%H "${GITHUB_SHA}" -- \
            "${NOTEAI_REQUEST_PATH}" > "${request_history_file}"
          request_add_commits=()
          while IFS= read -r request_add_commit; do
            request_add_commits+=("${request_add_commit}")
          done < "${request_history_file}"
          test "${#request_add_commits[@]}" -eq 1
          test "${request_add_commits[0]}" = "${GITHUB_SHA}"

          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          test "$(git rev-parse "${RELEASE_COMMIT}^{tree}")" = "${RELEASE_TREE}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" "${controller_parent}"

          export_helper_copy="${RUNNER_TEMP}/noteai-export-admin-dependency-cache.sh"
          import_helper_copy="${RUNNER_TEMP}/noteai-import-admin-dependency-cache.sh"
          bundle_verifier_copy="${RUNNER_TEMP}/noteai-verify-admin-cache-bundle.py"
          cp "${NOTEAI_EXPORT_HELPER_PATH}" "${export_helper_copy}"
          cp "${NOTEAI_IMPORT_HELPER_PATH}" "${import_helper_copy}"
          cp "${NOTEAI_BUNDLE_VERIFIER_PATH}" "${bundle_verifier_copy}"
          chmod 0500 \
            "${export_helper_copy}" \
            "${import_helper_copy}" \
            "${bundle_verifier_copy}"
          workflow_sha256="$(
            sha256sum .github/workflows/admin-dependency-cache-export.yml |
              awk '{print $1}'
          )"

          printf 'plan_checkpoint_commit=%s\n' "${controller_parent}" \
            >> "${GITHUB_OUTPUT}"
          printf 'control_commit=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'request_sha256=%s\n' "${request_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'export_helper_copy=%s\n' "${export_helper_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'import_helper_copy=%s\n' "${import_helper_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'bundle_verifier_copy=%s\n' "${bundle_verifier_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'workflow_sha256=%s\n' "${workflow_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Checkout exact 5335 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify immutable dependency-prefix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          test "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}"
          test -z "$(git status --short)"
          test "$(
            sha256sum Dockerfile | awk '{print $1}'
          )" = "ed6282c422dde6e49c33da877bccf735dfbb19e29a834930fb2a1a52ef21b447"
          test "$(
            sha256sum .dockerignore | awk '{print $1}'
          )" = "d327ca46e4800b2af3c073c7e40bac93e0a042fec016fe6b798a5bd6944d3149"
          test "$(
            sha256sum model/requirements.txt | awk '{print $1}'
          )" = "1ef4150536e98b8057069981b1aadb469ca12f0f30f188a291af2f31e238724a"
          test "$(
            sha256sum model/requirements-api.txt | awk '{print $1}'
          )" = "0231c534fc2ca1ca503f5b29e19c503be995672cf20afd8203e207ffc8354ea9"

      - name: Create isolated producer and fresh consumer builders
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config
        shell: bash
        run: |
          set -euo pipefail
          test "${NOTEAI_PRODUCER_BUILDER}" != "${NOTEAI_CONSUMER_BUILDER}"
          test ! -e "${DOCKER_CONFIG}"
          mkdir -m 0700 "${DOCKER_CONFIG}"
          jq -n '{auths: {}}' > "${DOCKER_CONFIG}/config.json"
          chmod 0600 "${DOCKER_CONFIG}/config.json"
          jq -e '
            type == "object"
            and (keys == ["auths"])
            and .auths == {}
          ' "${DOCKER_CONFIG}/config.json" >/dev/null
          docker image ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-images-before"
          docker container ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-containers-before"
          docker volume ls --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-volumes-before"
          docker network ls --no-trunc --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-networks-before"
          docker buildx create \
            --name "${NOTEAI_PRODUCER_BUILDER}" \
            --driver docker-container
          docker buildx create \
            --name "${NOTEAI_CONSUMER_BUILDER}" \
            --driver docker-container
          docker buildx inspect "${NOTEAI_PRODUCER_BUILDER}" --bootstrap
          docker buildx inspect "${NOTEAI_CONSUMER_BUILDER}" --bootstrap

      - name: Export dependency-only BuildKit local cache
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle
          NOTEAI_PLAN_CHECKPOINT_COMMIT: ${{ steps.control.outputs.plan_checkpoint_commit }}
          NOTEAI_CONTROL_COMMIT: ${{ steps.control.outputs.control_commit }}
          NOTEAI_REQUEST_SHA256: ${{ steps.control.outputs.request_sha256 }}
          NOTEAI_WORKFLOW_SHA256: ${{ steps.control.outputs.workflow_sha256 }}
          NOTEAI_EXPORT_HELPER_PATH: ${{ steps.control.outputs.export_helper_copy }}
          NOTEAI_IMPORT_HELPER_PATH: ${{ steps.control.outputs.import_helper_copy }}
          NOTEAI_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          "${NOTEAI_EXPORT_HELPER_PATH}"
          test -z "$(git status --short)"

      - name: Prove fresh-consumer import and cacheless full-context replay
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config
          NOTEAI_IMPORT_MODE: ci_portability
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle
          NOTEAI_SOURCE_DIR: ${{ github.workspace }}
          NOTEAI_BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
          NOTEAI_PRODUCER_BUILDER_NAME: ${{ env.NOTEAI_PRODUCER_BUILDER }}
          NOTEAI_IMPORT_EVIDENCE_DIR: ${{ runner.temp }}/unused-ci-import-evidence
          NOTEAI_TRUSTED_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
          NOTEAI_BUNDLE_VERIFIER_SHA256: ${{ env.NOTEAI_BUNDLE_VERIFIER_SHA256 }}
          NOTEAI_EXPECTED_IMPORT_HELPER_SHA256: ${{ env.NOTEAI_IMPORT_HELPER_SHA256 }}
          BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
        shell: bash
        run: |
          set -euo pipefail
          bash "${{ steps.control.outputs.import_helper_copy }}"
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/SHA256SUMS"
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/portability/proof.json"

      - name: Remove isolated builders and all transient Docker state
        id: cleanup
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config
        shell: bash
        run: |
          set -euo pipefail
          docker buildx rm "${NOTEAI_PRODUCER_BUILDER}" >/dev/null 2>&1 || true
          docker buildx rm "${NOTEAI_CONSUMER_BUILDER}" >/dev/null 2>&1 || true

          docker image ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-images-after-builders"
          comm -13 \
            "${RUNNER_TEMP}/noteai-images-before" \
            "${RUNNER_TEMP}/noteai-images-after-builders" \
            > "${RUNNER_TEMP}/noteai-new-image-ids"
          while IFS= read -r image_id; do
            if [ -n "${image_id}" ]; then
              docker image rm "${image_id}" >/dev/null
            fi
          done < "${RUNNER_TEMP}/noteai-new-image-ids"

          docker image ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-images-after"
          docker container ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-containers-after"
          docker volume ls --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-volumes-after"
          docker network ls --no-trunc --quiet |
            LC_ALL=C sort -u > "${RUNNER_TEMP}/noteai-networks-after"
          cmp \
            "${RUNNER_TEMP}/noteai-images-before" \
            "${RUNNER_TEMP}/noteai-images-after"
          cmp \
            "${RUNNER_TEMP}/noteai-containers-before" \
            "${RUNNER_TEMP}/noteai-containers-after"
          cmp \
            "${RUNNER_TEMP}/noteai-volumes-before" \
            "${RUNNER_TEMP}/noteai-volumes-after"
          cmp \
            "${RUNNER_TEMP}/noteai-networks-before" \
            "${RUNNER_TEMP}/noteai-networks-after"
          test -f "${DOCKER_CONFIG}/config.json"
          rm -f "${DOCKER_CONFIG}/config.json"
          rmdir "${DOCKER_CONFIG}"
          test ! -e "${DOCKER_CONFIG}"
          printf 'cleanup_passed=true\n' >> "${GITHUB_OUTPUT}"

      - name: Validate final portable bundle after cleanup
        id: bundle
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        env:
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle
        shell: bash
        run: |
          set -euo pipefail
          expected_sums_sha256="$(
            tr -d '\r\n' < "${RUNNER_TEMP}/noteai-final-sums-sha256"
          )"
          test "$(
            printf '%s' "${expected_sums_sha256}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          final_extract="${RUNNER_TEMP}/noteai-final-cache-validation"
          python3 \
            "${{ steps.control.outputs.bundle_verifier_copy }}" \
            verify-final \
            --bundle "${NOTEAI_CACHE_BUNDLE_DIR}" \
            --extract-to "${final_extract}" \
            --expected-sums-sha256 "${expected_sums_sha256}" \
            --output "${RUNNER_TEMP}/noteai-final-bundle-validation.json"
          jq -e '
            .artifact_input_bytes <= .artifact_input_maximum_bytes
            and .artifact_input_maximum_bytes == 4026531840
            and .artifact_provider_maximum_bytes == 4294967296
          ' "${RUNNER_TEMP}/noteai-final-bundle-validation.json" >/dev/null
          rm -rf "${final_extract}"
          test ! -e "${final_extract}"
          printf 'final_sums_sha256=%s\n' "${expected_sums_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload one-day public-repository dependency cache artifact
        id: upload
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.NOTEAI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

      - name: Confirm provider artifact identity
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${{ steps.upload.outputs.artifact-id }}"
          test "$(
            printf '%s' "${{ steps.upload.outputs.artifact-digest }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          test "$(
            printf '%s' "${{ steps.bundle.outputs.final_sums_sha256 }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          echo "admin_dependency_cache_artifact=UPLOADED retention_days=1 run_attempt=1"
