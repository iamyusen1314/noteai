name: Admin dependency cache export V5

on:
  push:
    branches:
      - codex/quality-stabilization-real-chain
    paths:
      - .github/release-requests/admin-5335bda-dependency-cache-v5.json

permissions:
  contents: read

concurrency:
  group: admin-dependency-cache-export-v5-${{ github.sha }}
  cancel-in-progress: false

jobs:
  export-cache:
    name: Recover and prove exact 5335 Admin dependency prefix cache
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      NOTEAI_REQUEST_PATH: .github/release-requests/admin-5335bda-dependency-cache-v5.json
      NOTEAI_REQUEST_TEMPLATE: deploy/production/plans/admin-dependency-cache-export-request-v5.json
      NOTEAI_REQUEST_TEMPLATE_SHA256: 766a87aec122860e325730eeebc24a705ec777dc157ae603b3e154ffd6d6dfad
      NOTEAI_V4_REQUEST_PATH: .github/release-requests/admin-5335bda-dependency-cache-v4.json
      NOTEAI_V4_REQUEST_SHA256: ad398386b7f01e8481a741c634da8e66ff1ba1d091bfaf0dff2f719b29172ec4
      NOTEAI_V4_CONTROL_COMMIT: d5aa7e537590ed138d254b9909a1ac105ee321ce
      NOTEAI_V4_WORKFLOW_PATH: .github/workflows/admin-dependency-cache-export-v4.yml
      NOTEAI_V4_WORKFLOW_SHA256: 5331e03bd2080651c5374b6f051e34da569eb16d50ed3f8b3b9856edc94304cc
      NOTEAI_V4_TEMPLATE_PATH: deploy/production/plans/admin-dependency-cache-export-request-v4.json
      NOTEAI_V4_TEMPLATE_SHA256: 6e2a7ba6f6f242ef1bcaa84cc47cbab4d51763d2425b4999b6f506e769a614da
      NOTEAI_V4_PLAN_VERIFIER_PATH: tools/verify_admin_dependency_cache_export_plan_v4.py
      NOTEAI_V4_PLAN_VERIFIER_SHA256: b8f05cc19cdc59171f4e41d6b31f5c15809852e18b61046164dafedc2c8b9fbf
      NOTEAI_V4_TRANSIENT_VERIFIER_PATH: tools/verify_admin_dependency_cache_transient_state_v4.py
      NOTEAI_V4_TRANSIENT_VERIFIER_SHA256: a6578845bc220f38ffc819ced26d8d0c3530b37e53ebc4c74cceeb4b523ea432
      NOTEAI_V4_CLEANUP_HELPER_PATH: scripts/ci/cleanup_admin_dependency_cache_v4.sh
      NOTEAI_V4_CLEANUP_HELPER_SHA256: 6cc130389abcd60a6f1e901160957ab2f2c33e0986e4b8c2a6c6fa89caa23ab2
      NOTEAI_FAILURE_EVIDENCE_PATH: deploy/production/evidence/admin-dependency-cache-v4-attempt1-failed-20260731.json
      NOTEAI_FAILURE_EVIDENCE_SHA256: 237891f4f1a1c7ff387965d0b98d2791404e33815d1688ecb271761526e16fb1
      NOTEAI_FAILURE_EVIDENCE_VERIFIER_PATH: tools/verify_admin_dependency_cache_v4_failure_evidence.py
      NOTEAI_FAILURE_EVIDENCE_VERIFIER_SHA256: 79805c3e5240adf88c2db9d704932462532f1b43dd9838f76e0b1e93ee86b21f
      NOTEAI_EXPORT_HELPER_PATH: scripts/ci/export_admin_dependency_cache.sh
      NOTEAI_EXPORT_HELPER_SHA256: fabcdc2245c537c2fd56e88b6e0aced77d5c26234fc74d7d934b11ecda8d860c
      NOTEAI_IMPORT_HELPER_PATH: scripts/ci/import_admin_dependency_cache.sh
      NOTEAI_IMPORT_HELPER_SHA256: c4986143d5897140f72ad6835b44f7fc989830a30341cb4e3f5718fced3ca777
      NOTEAI_BASE_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle.py
      NOTEAI_BASE_BUNDLE_VERIFIER_SHA256: bf526c29b213dc15d257cb9aedc52790aa1dc9cf1f82bba0e6e85e41db3edf38
      NOTEAI_BUNDLE_VERIFIER_PATH: tools/verify_admin_dependency_cache_bundle_v3.py
      NOTEAI_BUNDLE_VERIFIER_SHA256: c2e318d5d9cbe196d8b9294277c85e1ee986ccb3e1970b3d25a31d28c8da0fef
      NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: tools/verify_admin_dependency_cache_transient_state_v5.py
      NOTEAI_TRANSIENT_STATE_VERIFIER_SHA256: 4b81fb25c259a5a5c8a3f115b6d4539698280c744535c5ff002b658dbec9cb5f
      NOTEAI_CLEANUP_HELPER_PATH: scripts/ci/cleanup_admin_dependency_cache_v5.sh
      NOTEAI_CLEANUP_HELPER_SHA256: a291c7242a0ac343faca19a921b2ad056d212aa2ef175a6b58b33ef028bbf239
      NOTEAI_DOWNLOAD_HELPER_PATH: scripts/ci/download_admin_dependency_cache_artifact.sh
      NOTEAI_DOWNLOAD_HELPER_SHA256: 66abfd513be7aa81946072493e1472030a8acccbf7a3e2d4dc461c94712e2a92
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH: tools/verify_admin_dependency_cache_provider_download.py
      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_SHA256: ca05697d12b8c02b183b1c611c33781d63641c5369bc54b2508a538591a0986b
      NOTEAI_BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      NOTEAI_BUILDX_MODULE: github.com/docker/buildx
      NOTEAI_BUILDX_VERSION: v0.35.0
      NOTEAI_BUILDX_SOURCE_COMMIT: a319e5b15052cf6557ceb666eb8ff6e32380b782
      NOTEAI_BUILDKITD_FLAGS: "--allow-insecure-entitlement=network.host"
      RELEASE_COMMIT: 5335bdaed933b1f999b5f819c047ec50c11821ae
      RELEASE_TREE: 38e574e56406ba3380acb78edbe784508cc537cd
      NOTEAI_OCI_SOURCE: "https://github.com/iamyusen1314/noteai"
      NOTEAI_OCI_VERSION: "git-5335bda-amd64-r1"
      NOTEAI_OCI_CREATED: "2026-07-30T13:29:02Z"
      NOTEAI_ARTIFACT_NAME: "admin-dependency-prefix-cache-5335bda-v5"
      NOTEAI_PRODUCER_BUILDER: noteai-admin-cache-v5-producer-${{ github.run_id }}
      NOTEAI_CONSUMER_BUILDER: noteai-admin-cache-v5-consumer-${{ github.run_id }}
      NOTEAI_PRE_CLEANUP_BUDGET_SECONDS: "5700"
      NOTEAI_CLEANUP_BUDGET_SECONDS: "6300"
      NOTEAI_SETUP_CALL_MAX_SECONDS: "300"
      NOTEAI_EXPORT_CALL_MAX_SECONDS: "3600"
      NOTEAI_IMPORT_CALL_MAX_SECONDS: "900"
      NOTEAI_CLEANUP_COMMAND_TIMEOUT_SECONDS: "15"
      BUILDX_METADATA_PROVENANCE: max
      BUILDKIT_NO_CLIENT_TOKEN: "1"

    steps:
      - name: Initialize V5 bounded job deadlines
        shell: bash
        run: |
          set -euo pipefail
          command -v timeout >/dev/null
          job_control_epoch="$(date +%s)"
          test "${NOTEAI_PRE_CLEANUP_BUDGET_SECONDS}" = "5700"
          test "${NOTEAI_CLEANUP_BUDGET_SECONDS}" = "6300"
          test "${NOTEAI_SETUP_CALL_MAX_SECONDS}" = "300"
          test "${NOTEAI_EXPORT_CALL_MAX_SECONDS}" = "3600"
          test "${NOTEAI_IMPORT_CALL_MAX_SECONDS}" = "900"
          test "${NOTEAI_CLEANUP_COMMAND_TIMEOUT_SECONDS}" = "15"
          printf 'NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH=%s\n' \
            "$((job_control_epoch + NOTEAI_PRE_CLEANUP_BUDGET_SECONDS))" \
            >> "${GITHUB_ENV}"
          printf 'NOTEAI_CLEANUP_DEADLINE_EPOCH=%s\n' \
            "$((job_control_epoch + NOTEAI_CLEANUP_BUDGET_SECONDS))" \
            >> "${GITHUB_ENV}"

      - name: Checkout V5 one-shot controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Resolve exact V5 recovery request
        id: control
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_NAME}" = "codex/quality-stabilization-real-chain"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"

          parent_record="$(git rev-list --parents -n 1 "${GITHUB_SHA}")"
          read -r -a parent_fields <<<"${parent_record}"
          test "${#parent_fields[@]}" -eq 2
          test "${parent_fields[0]}" = "${GITHUB_SHA}"
          controller_parent="$(git rev-parse "${GITHUB_SHA}^")"

          changed_file_list="${RUNNER_TEMP}/noteai-cache-v5-changed-files"
          git diff-tree --no-commit-id --no-renames \
            --name-only -z -r "${controller_parent}" "${GITHUB_SHA}" \
            > "${changed_file_list}"
          changed_files=()
          while IFS= read -r -d '' changed_file; do
            changed_files+=("${changed_file}")
          done < "${changed_file_list}"
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "${NOTEAI_REQUEST_PATH}"
          test "$(
            git diff-tree --no-commit-id --no-renames --diff-filter=A \
              --name-status -r "${controller_parent}" "${GITHUB_SHA}" \
              -- "${NOTEAI_REQUEST_PATH}"
          )" = $'A\t'"${NOTEAI_REQUEST_PATH}"
          test "$(
            git ls-tree "${GITHUB_SHA}" -- "${NOTEAI_REQUEST_PATH}" |
              awk '{print $1 " " $2}'
          )" = "100644 blob"

          for reviewed_path in \
            "${NOTEAI_REQUEST_TEMPLATE}" \
            "${NOTEAI_V4_REQUEST_PATH}" \
            "${NOTEAI_V4_WORKFLOW_PATH}" \
            "${NOTEAI_V4_TEMPLATE_PATH}" \
            "${NOTEAI_V4_PLAN_VERIFIER_PATH}" \
            "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            "${NOTEAI_V4_CLEANUP_HELPER_PATH}" \
            "${NOTEAI_FAILURE_EVIDENCE_PATH}" \
            "${NOTEAI_FAILURE_EVIDENCE_VERIFIER_PATH}" \
            "${NOTEAI_EXPORT_HELPER_PATH}" \
            "${NOTEAI_IMPORT_HELPER_PATH}" \
            "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_BUNDLE_VERIFIER_PATH}" \
            "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            "${NOTEAI_CLEANUP_HELPER_PATH}" \
            "${NOTEAI_DOWNLOAD_HELPER_PATH}" \
            "${NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH}"
          do
            test "$(
              git rev-parse "${controller_parent}:${reviewed_path}"
            )" = "$(
              git rev-parse "${GITHUB_SHA}:${reviewed_path}"
            )"
          done

          check_parent_sha256() {
            local expected="$1"
            local path="$2"
            test "$(
              git show "${controller_parent}:${path}" |
                sha256sum |
                awk '{print $1}'
            )" = "${expected}"
          }
          check_parent_sha256 \
            "${NOTEAI_REQUEST_TEMPLATE_SHA256}" \
            "${NOTEAI_REQUEST_TEMPLATE}"
          check_parent_sha256 \
            "${NOTEAI_V4_REQUEST_SHA256}" \
            "${NOTEAI_V4_REQUEST_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V4_WORKFLOW_SHA256}" \
            "${NOTEAI_V4_WORKFLOW_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V4_TEMPLATE_SHA256}" \
            "${NOTEAI_V4_TEMPLATE_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V4_PLAN_VERIFIER_SHA256}" \
            "${NOTEAI_V4_PLAN_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V4_TRANSIENT_VERIFIER_SHA256}" \
            "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_V4_CLEANUP_HELPER_SHA256}" \
            "${NOTEAI_V4_CLEANUP_HELPER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_FAILURE_EVIDENCE_SHA256}" \
            "${NOTEAI_FAILURE_EVIDENCE_PATH}"
          check_parent_sha256 \
            "${NOTEAI_FAILURE_EVIDENCE_VERIFIER_SHA256}" \
            "${NOTEAI_FAILURE_EVIDENCE_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_EXPORT_HELPER_SHA256}" \
            "${NOTEAI_EXPORT_HELPER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_IMPORT_HELPER_SHA256}" \
            "${NOTEAI_IMPORT_HELPER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_BASE_BUNDLE_VERIFIER_SHA256}" \
            "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_BUNDLE_VERIFIER_SHA256}" \
            "${NOTEAI_BUNDLE_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_TRANSIENT_STATE_VERIFIER_SHA256}" \
            "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_CLEANUP_HELPER_SHA256}" \
            "${NOTEAI_CLEANUP_HELPER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_DOWNLOAD_HELPER_SHA256}" \
            "${NOTEAI_DOWNLOAD_HELPER_PATH}"
          check_parent_sha256 \
            "${NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_SHA256}" \
            "${NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_PATH}"

          test "$(
            git log --diff-filter=A --format=%H "${GITHUB_SHA}" -- \
              "${NOTEAI_V4_REQUEST_PATH}"
          )" = "${NOTEAI_V4_CONTROL_COMMIT}"
          test "$(
            git show "${GITHUB_SHA}:${NOTEAI_V4_REQUEST_PATH}" |
              sha256sum |
              awk '{print $1}'
          )" = "${NOTEAI_V4_REQUEST_SHA256}"
          python3 "${NOTEAI_V4_PLAN_VERIFIER_PATH}"
          python3 "${NOTEAI_FAILURE_EVIDENCE_VERIFIER_PATH}"

          request_template="${RUNNER_TEMP}/noteai-cache-v5-request-template.json"
          request_file="${RUNNER_TEMP}/noteai-cache-v5-request.json"
          expected_request="${RUNNER_TEMP}/noteai-cache-v5-request-expected.json"
          git show "${controller_parent}:${NOTEAI_REQUEST_TEMPLATE}" \
            > "${request_template}"
          test "$(
            grep -o '__DIRECT_PARENT_COMMIT__' "${request_template}" |
              wc -l |
              tr -d ' '
          )" = "1"
          sed \
            "s/__DIRECT_PARENT_COMMIT__/${controller_parent}/" \
            "${request_template}" \
            > "${expected_request}"
          git show "${GITHUB_SHA}:${NOTEAI_REQUEST_PATH}" > "${request_file}"
          cmp "${request_file}" "${expected_request}"
          jq -e \
            --arg plan_checkpoint_commit "${controller_parent}" \
            --arg failure_evidence_sha256 "${NOTEAI_FAILURE_EVIDENCE_SHA256}" '
            type == "object"
            and .schema_version == 5
            and .task == "PROD-FIRST-LAUNCH-ADMIN-INTERNAL-001"
            and .release_commit == "5335bdaed933b1f999b5f819c047ec50c11821ae"
            and .plan_checkpoint_commit == $plan_checkpoint_commit
            and .release_scope == "admin_dependency_prefix_cache_recovery"
            and .trigger_mode == "one_shot_added_request_v5"
            and .predecessor == {
              control_commit: "d5aa7e537590ed138d254b9909a1ac105ee321ce",
              run_id: 30599069993,
              run_attempt: 1,
              conclusion: "failure",
              artifact_count: 0,
              rerun_authorized: false,
              failure_evidence_sha256: $failure_evidence_sha256
            }
            and .recovery_basis == {
              runner_image: "ubuntu-24.04",
              runner_image_observed_version: "20260726.254.1",
              buildx_version: "v0.35.0",
              buildx_source_commit:
                "a319e5b15052cf6557ceb666eb8ff6e32380b782",
              exact_buildkitd_flags: [
                "--allow-insecure-entitlement=network.host"
              ],
              additional_buildkitd_flags_authorized: false,
              build_network_host_authorized: false,
              github_actions_provenance_injection_authorized: false,
              buildkit_auth_behavior: "ordinary_credentials_only",
              phase_aware_client_state_required: true,
              structured_cleanup_receipt_required: true,
              pre_cleanup_deadline_seconds_from_control: 5700,
              cleanup_deadline_seconds_from_control: 6300,
              setup_call_maximum_seconds: 300,
              export_call_maximum_seconds: 3600,
              import_call_maximum_seconds: 900,
              cleanup_external_call_maximum_seconds: 15,
              atomic_docker_baseline_required: true
            }
            and .recovery_run_authorized_after_predecessor_failure == true
            and .github_actions_maximum_runtime_minutes == 120
            and .artifact_retention_days == 1
            and .artifact_input_maximum_bytes == 4026531840
            and .artifact_provider_maximum_bytes == 4294967296
            and .artifact_visibility_assumption == "public_repository_readers"
            and .dependency_cache_export_authorized == true
            and .public_repository_artifact_authorized == true
            and .cross_provider_transfer_authorized == true
            and .registry_publication_authorized == false
            and .deployment_authorized == false
            and .database_authorized == false
            and .service_mutation_authorized == false
            and .public_traffic_authorized == false
          ' "${request_file}" >/dev/null
          request_sha256="$(
            sha256sum "${request_file}" | awk '{print $1}'
          )"

          request_history_file="${RUNNER_TEMP}/noteai-cache-v5-request-history"
          git log --all --diff-filter=A --format=%H -- \
            "${NOTEAI_REQUEST_PATH}" > "${request_history_file}"
          request_add_commits=()
          while IFS= read -r request_add_commit; do
            request_add_commits+=("${request_add_commit}")
          done < "${request_history_file}"
          test "${#request_add_commits[@]}" -eq 1
          test "${request_add_commits[0]}" = "${GITHUB_SHA}"

          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          test "$(git rev-parse "${RELEASE_COMMIT}^{tree}")" = "${RELEASE_TREE}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" "${controller_parent}"

          export_helper_copy="${RUNNER_TEMP}/noteai-cache-v5-export.sh"
          import_helper_copy="${RUNNER_TEMP}/noteai-cache-v5-import-base.sh"
          base_verifier_copy="${RUNNER_TEMP}/noteai-cache-v5-bundle-base.py"
          bundle_verifier_copy="${RUNNER_TEMP}/noteai-cache-v5-bundle.py"
          v4_transient_verifier_copy="${RUNNER_TEMP}/noteai-cache-v5-transient-v4-base.py"
          transient_verifier_copy="${RUNNER_TEMP}/noteai-cache-v5-transient.py"
          cleanup_helper_copy="${RUNNER_TEMP}/noteai-cache-v5-cleanup.sh"
          cp "${NOTEAI_EXPORT_HELPER_PATH}" "${export_helper_copy}"
          cp "${NOTEAI_IMPORT_HELPER_PATH}" "${import_helper_copy}"
          cp "${NOTEAI_BASE_BUNDLE_VERIFIER_PATH}" "${base_verifier_copy}"
          cp "${NOTEAI_BUNDLE_VERIFIER_PATH}" "${bundle_verifier_copy}"
          cp "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            "${v4_transient_verifier_copy}"
          cp "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            "${transient_verifier_copy}"
          cp "${NOTEAI_CLEANUP_HELPER_PATH}" "${cleanup_helper_copy}"
          chmod 0500 \
            "${export_helper_copy}" \
            "${import_helper_copy}" \
            "${base_verifier_copy}" \
            "${bundle_verifier_copy}" \
            "${v4_transient_verifier_copy}" \
            "${transient_verifier_copy}" \
            "${cleanup_helper_copy}"
          workflow_sha256="$(
            sha256sum \
              .github/workflows/admin-dependency-cache-export-v5.yml |
              awk '{print $1}'
          )"

          printf 'plan_checkpoint_commit=%s\n' "${controller_parent}" \
            >> "${GITHUB_OUTPUT}"
          printf 'control_commit=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          printf 'request_sha256=%s\n' "${request_sha256}" >> "${GITHUB_OUTPUT}"
          printf 'export_helper_copy=%s\n' "${export_helper_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'import_helper_copy=%s\n' "${import_helper_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'base_verifier_copy=%s\n' "${base_verifier_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'bundle_verifier_copy=%s\n' "${bundle_verifier_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'v4_transient_verifier_copy=%s\n' \
            "${v4_transient_verifier_copy}" >> "${GITHUB_OUTPUT}"
          printf 'transient_verifier_copy=%s\n' "${transient_verifier_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'cleanup_helper_copy=%s\n' "${cleanup_helper_copy}" \
            >> "${GITHUB_OUTPUT}"
          printf 'workflow_sha256=%s\n' "${workflow_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Checkout exact 5335 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify immutable dependency-prefix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          test "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}"
          test -z "$(git status --short)"
          test "$(
            sha256sum Dockerfile | awk '{print $1}'
          )" = "ed6282c422dde6e49c33da877bccf735dfbb19e29a834930fb2a1a52ef21b447"
          test "$(
            sha256sum .dockerignore | awk '{print $1}'
          )" = "d327ca46e4800b2af3c073c7e40bac93e0a042fec016fe6b798a5bd6944d3149"
          test "$(
            sha256sum model/requirements.txt | awk '{print $1}'
          )" = "1ef4150536e98b8057069981b1aadb469ca12f0f30f188a291af2f31e238724a"
          test "$(
            sha256sum model/requirements-api.txt | awk '{print $1}'
          )" = "0231c534fc2ca1ca503f5b29e19c503be995672cf20afd8203e207ffc8354ea9"
          if grep -Eq -- \
            '--allow[[:space:]]+network\.host|--allow=network\.host|--network=host|--network[[:space:]]+host' \
            Dockerfile \
            "${{ steps.control.outputs.export_helper_copy }}" \
            "${{ steps.control.outputs.import_helper_copy }}"
          then
            echo "build-level host network request is forbidden" >&2
            exit 1
          fi

      - name: Create isolated V5 producer and consumer builders
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          test "${NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH}" -lt \
            "${NOTEAI_CLEANUP_DEADLINE_EPOCH}"
          test "${NOTEAI_PRODUCER_BUILDER}" != "${NOTEAI_CONSUMER_BUILDER}"
          buildx_identity="$(
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker buildx version
          )"
          read -r \
            buildx_module \
            buildx_version \
            buildx_commit \
            buildx_extra \
            <<<"${buildx_identity}"
          test "${buildx_module}" = "${NOTEAI_BUILDX_MODULE}"
          test "${buildx_version}" = "${NOTEAI_BUILDX_VERSION}"
          test "${#buildx_commit}" -ge 7
          test "${#buildx_commit}" -le 40
          test "${NOTEAI_BUILDX_SOURCE_COMMIT:0:${#buildx_commit}}" = \
            "${buildx_commit}"
          test -z "${buildx_extra}"
          test ! -e "${DOCKER_CONFIG}"
          test ! -e "${BUILDX_CONFIG}"
          mkdir -m 0700 "${DOCKER_CONFIG}"
          mkdir -m 0700 "${BUILDX_CONFIG}"
          jq -n '{auths: {}}' > "${DOCKER_CONFIG}/config.json"
          chmod 0600 "${DOCKER_CONFIG}/config.json"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build
          images_before="${RUNNER_TEMP}/noteai-images-before"
          containers_before="${RUNNER_TEMP}/noteai-containers-before"
          volumes_before="${RUNNER_TEMP}/noteai-volumes-before"
          networks_before="${RUNNER_TEMP}/noteai-networks-before"
          baseline_marker="${RUNNER_TEMP}/noteai-docker-baseline-v5.complete"
          for baseline_path in \
            "${images_before}" \
            "${containers_before}" \
            "${volumes_before}" \
            "${networks_before}" \
            "${images_before}.tmp" \
            "${containers_before}.tmp" \
            "${volumes_before}.tmp" \
            "${networks_before}.tmp" \
            "${baseline_marker}" \
            "${baseline_marker}.tmp"
          do
            test ! -e "${baseline_path}"
            test ! -L "${baseline_path}"
          done
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker image ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${images_before}.tmp"
          chmod 0600 "${images_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker container ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${containers_before}.tmp"
          chmod 0600 "${containers_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker volume ls --quiet |
            LC_ALL=C sort -u > "${volumes_before}.tmp"
          chmod 0600 "${volumes_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker network ls --no-trunc --quiet |
            LC_ALL=C sort -u > "${networks_before}.tmp"
          chmod 0600 "${networks_before}.tmp"
          mv -- "${images_before}.tmp" "${images_before}"
          mv -- "${containers_before}.tmp" "${containers_before}"
          mv -- "${volumes_before}.tmp" "${volumes_before}"
          mv -- "${networks_before}.tmp" "${networks_before}"
          printf 'noteai-docker-baseline-v5=complete\n' \
            > "${baseline_marker}.tmp"
          chmod 0600 "${baseline_marker}.tmp"
          mv -- "${baseline_marker}.tmp" "${baseline_marker}"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker buildx create \
            --name "${NOTEAI_PRODUCER_BUILDER}" \
            --driver docker-container \
            --driver-opt "image=${NOTEAI_BUILDKIT_IMAGE}" \
            --driver-opt "provenance-add-gha=false" \
            --buildkitd-flags "${NOTEAI_BUILDKITD_FLAGS}"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker buildx create \
            --name "${NOTEAI_CONSUMER_BUILDER}" \
            --driver docker-container \
            --driver-opt "image=${NOTEAI_BUILDKIT_IMAGE}" \
            --driver-opt "provenance-add-gha=false" \
            --buildkitd-flags "${NOTEAI_BUILDKITD_FLAGS}"
          for builder_name in \
            "${NOTEAI_PRODUCER_BUILDER}" \
            "${NOTEAI_CONSUMER_BUILDER}"
          do
            builder_inspect="${RUNNER_TEMP}/${builder_name}-inspect"
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker buildx inspect "${builder_name}" --bootstrap \
              > "${builder_inspect}"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*Driver[[:space:]]*$/ {
                  value = $2
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "docker-container"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*BuildKit version[[:space:]]*$/ {
                  value = $2
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "v0.31.2"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*BuildKit daemon flags[[:space:]]*$/ {
                  value = substr($0, index($0, ":") + 1)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "${NOTEAI_BUILDKITD_FLAGS}"
            grep -Eq \
              '^[[:space:]]*Platforms:[[:space:]]+linux/amd64(,|$)' \
              "${builder_inspect}"
            container_name="buildx_buildkit_${builder_name}0"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.Name}}' "${container_name}"
            )" = "/${container_name}"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.State.Running}}' "${container_name}"
            )" = "true"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.Config.Image}}' "${container_name}"
            )" = "${NOTEAI_BUILDKIT_IMAGE}"
            if ! run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker exec "${container_name}" sh -eu -c '
              root=/etc/buildkit/provenance.d
              [ ! -L "${root}" ] || exit 41
              [ ! -e "${root}" ] || [ -d "${root}" ] || exit 41
              for candidate in \
                "${root}"/*.json \
                "${root}"/.json \
                "${root}"/.[!.]*.json \
                "${root}"/..json \
                "${root}"/..*.json \
                "${root}"/..?*.json
              do
                if [ -e "${candidate}" ] || [ -L "${candidate}" ]; then
                  exit 41
                fi
              done
            ' </dev/null >/dev/null 2>&1
            then
              echo "BuildKit provenance drop-in gate failed" >&2
              exit 1
            fi
            rm -f -- "${builder_inspect}"
          done
          echo "admin_dependency_cache_buildkit_provenance_dropins=ABSENT builders=2"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build

      - name: Export V5 dependency-only BuildKit local cache
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v5
          NOTEAI_PLAN_CHECKPOINT_COMMIT: ${{ steps.control.outputs.plan_checkpoint_commit }}
          NOTEAI_CONTROL_COMMIT: ${{ steps.control.outputs.control_commit }}
          NOTEAI_REQUEST_SHA256: ${{ steps.control.outputs.request_sha256 }}
          NOTEAI_WORKFLOW_SHA256: ${{ steps.control.outputs.workflow_sha256 }}
          NOTEAI_EXPORT_HELPER_PATH: ${{ steps.control.outputs.export_helper_copy }}
          NOTEAI_IMPORT_HELPER_PATH: ${{ steps.control.outputs.import_helper_copy }}
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          test -z "$(git status --short)"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build
          export_rc=0
          run_before_cleanup_deadline \
            "${NOTEAI_EXPORT_CALL_MAX_SECONDS}" \
            "${NOTEAI_EXPORT_HELPER_PATH}" || export_rc=$?
          if [[ "${export_rc}" -ne 0 ]]; then
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
              --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
              --runner-temp "${RUNNER_TEMP}" \
              --docker-config "${DOCKER_CONFIG}" \
              --buildx-config "${BUILDX_CONFIG}" \
              --phase cleanup-active
            exit "${export_rc}"
          fi
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          test -z "$(git status --short)"

      - name: Prove V5 fresh-consumer import and cacheless replay
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_IMPORT_MODE: ci_portability
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v5
          NOTEAI_SOURCE_DIR: ${{ github.workspace }}
          NOTEAI_BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
          NOTEAI_PRODUCER_BUILDER_NAME: ${{ env.NOTEAI_PRODUCER_BUILDER }}
          NOTEAI_IMPORT_EVIDENCE_DIR: ${{ runner.temp }}/unused-v5-import-evidence
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_TRUSTED_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
          NOTEAI_EXPECTED_IMPORT_HELPER_SHA256: ${{ env.NOTEAI_IMPORT_HELPER_SHA256 }}
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
          BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          import_rc=0
          run_before_cleanup_deadline \
            "${NOTEAI_IMPORT_CALL_MAX_SECONDS}" \
            bash "${{ steps.control.outputs.import_helper_copy }}" ||
            import_rc=$?
          if [[ "${import_rc}" -ne 0 ]]; then
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
              --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
              --runner-temp "${RUNNER_TEMP}" \
              --docker-config "${DOCKER_CONFIG}" \
              --buildx-config "${BUILDX_CONFIG}" \
              --phase cleanup-active
            exit "${import_rc}"
          fi
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/SHA256SUMS"
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/portability/proof.json"

      - name: Remove V5 builders and all transient Docker state
        id: cleanup
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_CLEANUP_RECEIPT_PATH: ${{ runner.temp }}/noteai-admin-dependency-cache-cleanup-v5.json
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
          NOTEAI_CLEANUP_HELPER_PATH: ${{ steps.control.outputs.cleanup_helper_copy }}
        shell: bash
        run: |
          set -euo pipefail
          bash "${NOTEAI_CLEANUP_HELPER_PATH}"
          jq -e '
            type == "object"
            and keys == [
              "buildx_root_absent",
              "cleanup_effective",
              "client_token_disabled",
              "consumer_builder_absent",
              "consumer_builder_remove",
              "containers_parity",
              "deadline_control_valid",
              "diagnostic_files_absent",
              "docker_baseline_state",
              "docker_root_absent",
              "images_parity",
              "networks_parity",
              "new_images_remove",
              "overall_pass",
              "post_builder_state",
              "pre_state",
              "producer_builder_absent",
              "producer_builder_remove",
              "schema_version",
              "volumes_parity"
            ]
            and .schema_version == 2
            and .deadline_control_valid == true
            and .client_token_disabled == true
            and .docker_baseline_state == "pass"
            and .producer_builder_absent == "pass"
            and .consumer_builder_absent == "pass"
            and .images_parity == "pass"
            and .containers_parity == "pass"
            and .volumes_parity == "pass"
            and .networks_parity == "pass"
            and .docker_root_absent == "pass"
            and .buildx_root_absent == "pass"
            and .diagnostic_files_absent == "pass"
            and .cleanup_effective == true
            and .overall_pass == true
          ' "${NOTEAI_CLEANUP_RECEIPT_PATH}" >/dev/null
          printf 'cleanup_passed=true\n' >> "${GITHUB_OUTPUT}"

      - name: Validate final V5 portable bundle after cleanup
        id: bundle
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        env:
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v5
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sums_sha256="$(
            tr -d '\r\n' < "${RUNNER_TEMP}/noteai-final-sums-sha256"
          )"
          test "$(
            printf '%s' "${expected_sums_sha256}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          final_extract="${RUNNER_TEMP}/noteai-final-cache-v5-validation"
          python3 \
            "${{ steps.control.outputs.bundle_verifier_copy }}" \
            verify-final \
            --bundle "${NOTEAI_CACHE_BUNDLE_DIR}" \
            --extract-to "${final_extract}" \
            --expected-sums-sha256 "${expected_sums_sha256}" \
            --output "${RUNNER_TEMP}/noteai-final-bundle-v5-validation.json"
          jq -e '
            .artifact_input_bytes <= .artifact_input_maximum_bytes
            and .artifact_input_maximum_bytes == 4026531840
            and .artifact_provider_maximum_bytes == 4294967296
          ' "${RUNNER_TEMP}/noteai-final-bundle-v5-validation.json" >/dev/null
          rm -rf --one-file-system -- "${final_extract}"
          test ! -e "${final_extract}"
          printf 'final_sums_sha256=%s\n' "${expected_sums_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload one-day V5 public-repository dependency cache artifact
        id: upload
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.NOTEAI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v5
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

      - name: Confirm V5 provider artifact identity
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${{ steps.upload.outputs.artifact-id }}"
          test "$(
            printf '%s' "${{ steps.upload.outputs.artifact-digest }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          test "$(
            printf '%s' "${{ steps.bundle.outputs.final_sums_sha256 }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          echo "admin_dependency_cache_v5_artifact=UPLOADED retention_days=1 run_attempt=1"

      - name: Remove runner-local V5 bundle
        if: always()
        env:
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v5
          NOTEAI_CLEANUP_RECEIPT_PATH: ${{ runner.temp }}/noteai-admin-dependency-cache-cleanup-v5.json
        shell: bash
        run: |
          set -euo pipefail
          test "${NOTEAI_CACHE_BUNDLE_DIR}" = \
            "${RUNNER_TEMP}/noteai-admin-dependency-cache-bundle-v5"
          test ! -L "${NOTEAI_CACHE_BUNDLE_DIR}"
          if [[ -e "${NOTEAI_CACHE_BUNDLE_DIR}" ]]; then
            rm -rf --one-file-system -- "${NOTEAI_CACHE_BUNDLE_DIR}"
          fi
          test ! -e "${NOTEAI_CACHE_BUNDLE_DIR}"
          test "${NOTEAI_CLEANUP_RECEIPT_PATH}" = \
            "${RUNNER_TEMP}/noteai-admin-dependency-cache-cleanup-v5.json"
          test ! -L "${NOTEAI_CLEANUP_RECEIPT_PATH}"
          rm -f -- "${NOTEAI_CLEANUP_RECEIPT_PATH}"
          test ! -e "${NOTEAI_CLEANUP_RECEIPT_PATH}"
