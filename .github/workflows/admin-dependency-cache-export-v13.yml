      - name: Checkout exact 5335 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Verify immutable dependency-prefix source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          test "$(git rev-parse HEAD^{tree})" = "${RELEASE_TREE}"
          test -z "$(git status --short)"
          test "$(
            sha256sum Dockerfile | awk '{print $1}'
          )" = "ed6282c422dde6e49c33da877bccf735dfbb19e29a834930fb2a1a52ef21b447"
          test "$(
            sha256sum .dockerignore | awk '{print $1}'
          )" = "d327ca46e4800b2af3c073c7e40bac93e0a042fec016fe6b798a5bd6944d3149"
          test "$(
            sha256sum model/requirements.txt | awk '{print $1}'
          )" = "1ef4150536e98b8057069981b1aadb469ca12f0f30f188a291af2f31e238724a"
          test "$(
            sha256sum model/requirements-api.txt | awk '{print $1}'
          )" = "0231c534fc2ca1ca503f5b29e19c503be995672cf20afd8203e207ffc8354ea9"
          if grep -Eq -- \
            '--allow[[:space:]]+network\.host|--allow=network\.host|--network=host|--network[[:space:]]+host' \
            Dockerfile \
            "${{ steps.control.outputs.export_helper_copy }}" \
            "${{ steps.control.outputs.import_helper_copy }}"
          then
            echo "build-level host network request is forbidden" >&2
            exit 1
          fi

      - name: Snapshot V2 through V13 ledgers before resource creation
        id: pre_ledger
        shell: bash
        env:
          NOTEAI_ACTIONS_READ_TOKEN: ${{ github.token }}
          NOTEAI_V13_LEDGER_CONTRACT_PATH: ${{ steps.control.outputs.ledger_contract_copy }}
        run: |
          set -euo pipefail
          ledger_path="${RUNNER_TEMP}/noteai-cache-v13-pre-resource-ledger.json"
          test ! -e "${ledger_path}"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${{ steps.control.outputs.ledger_verifier_copy }}" \
            live-ledger \
            --phase pre_resource \
            --output "${ledger_path}"
          test -f "${ledger_path}"
          test "$(stat -c '%a' "${ledger_path}")" = "600"
          printf 'ledger_path=%s\n' "${ledger_path}" >> "${GITHUB_OUTPUT}"
          printf 'ledger_sha256=%s\n' "$(sha256sum "${ledger_path}" | awk '{print $1}')" \
            >> "${GITHUB_OUTPUT}"
      - name: Create isolated V13 producer and consumer builders
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          test "${NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH}" -lt \
            "${NOTEAI_CLEANUP_DEADLINE_EPOCH}"
          test "${NOTEAI_PRODUCER_BUILDER}" != "${NOTEAI_CONSUMER_BUILDER}"
          buildx_identity="$(
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker buildx version
          )"
          read -r \
            buildx_module \
            buildx_version \
            buildx_commit \
            buildx_extra \
            <<<"${buildx_identity}"
          test "${buildx_module}" = "${NOTEAI_BUILDX_MODULE}"
          test "${buildx_version}" = "${NOTEAI_BUILDX_VERSION}"
          test "${#buildx_commit}" -ge 7
          test "${#buildx_commit}" -le 40
          test "${NOTEAI_BUILDX_SOURCE_COMMIT:0:${#buildx_commit}}" = \
            "${buildx_commit}"
          test -z "${buildx_extra}"
          test ! -e "${DOCKER_CONFIG}"
          test ! -e "${BUILDX_CONFIG}"
          mkdir -m 0700 "${DOCKER_CONFIG}"
          mkdir -m 0700 "${BUILDX_CONFIG}"
          jq -n '{auths: {}}' > "${DOCKER_CONFIG}/config.json"
          chmod 0600 "${DOCKER_CONFIG}/config.json"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build
          images_before="${RUNNER_TEMP}/noteai-images-before"
          containers_before="${RUNNER_TEMP}/noteai-containers-before"
          volumes_before="${RUNNER_TEMP}/noteai-volumes-before"
          networks_before="${RUNNER_TEMP}/noteai-networks-before"
          baseline_marker="${RUNNER_TEMP}/noteai-docker-baseline-v5.complete"
          for baseline_path in \
            "${images_before}" \
            "${containers_before}" \
            "${volumes_before}" \
            "${networks_before}" \
            "${images_before}.tmp" \
            "${containers_before}.tmp" \
            "${volumes_before}.tmp" \
            "${networks_before}.tmp" \
            "${baseline_marker}" \
            "${baseline_marker}.tmp"
          do
            test ! -e "${baseline_path}"
            test ! -L "${baseline_path}"
          done
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker image ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${images_before}.tmp"
          chmod 0600 "${images_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker container ls --all --no-trunc --quiet |
            LC_ALL=C sort -u > "${containers_before}.tmp"
          chmod 0600 "${containers_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker volume ls --quiet |
            LC_ALL=C sort -u > "${volumes_before}.tmp"
          chmod 0600 "${volumes_before}.tmp"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker network ls --no-trunc --quiet |
            LC_ALL=C sort -u > "${networks_before}.tmp"
          chmod 0600 "${networks_before}.tmp"
          mv -- "${images_before}.tmp" "${images_before}"
          mv -- "${containers_before}.tmp" "${containers_before}"
          mv -- "${volumes_before}.tmp" "${volumes_before}"
          mv -- "${networks_before}.tmp" "${networks_before}"
          printf 'noteai-docker-baseline-v5=complete\n' \
            > "${baseline_marker}.tmp"
          chmod 0600 "${baseline_marker}.tmp"
          mv -- "${baseline_marker}.tmp" "${baseline_marker}"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker buildx create \
            --name "${NOTEAI_PRODUCER_BUILDER}" \
            --driver docker-container \
            --driver-opt "image=${NOTEAI_BUILDKIT_IMAGE}" \
            --driver-opt "provenance-add-gha=false" \
            --buildkitd-flags "${NOTEAI_BUILDKITD_FLAGS}"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            docker buildx create \
            --name "${NOTEAI_CONSUMER_BUILDER}" \
            --driver docker-container \
            --driver-opt "image=${NOTEAI_BUILDKIT_IMAGE}" \
            --driver-opt "provenance-add-gha=false" \
            --buildkitd-flags "${NOTEAI_BUILDKITD_FLAGS}"
          for builder_name in \
            "${NOTEAI_PRODUCER_BUILDER}" \
            "${NOTEAI_CONSUMER_BUILDER}"
          do
            builder_inspect="${RUNNER_TEMP}/${builder_name}-inspect"
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker buildx inspect "${builder_name}" --bootstrap \
              > "${builder_inspect}"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*Driver[[:space:]]*$/ {
                  value = $2
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "docker-container"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*BuildKit version[[:space:]]*$/ {
                  value = $2
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "v0.31.2"
            test "$(
              awk -F: '
                $1 ~ /^[[:space:]]*BuildKit daemon flags[[:space:]]*$/ {
                  value = substr($0, index($0, ":") + 1)
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                  print value
                }
              ' "${builder_inspect}" | LC_ALL=C sort -u
            )" = "${NOTEAI_BUILDKITD_FLAGS}"
            grep -Eq \
              '^[[:space:]]*Platforms:[[:space:]]+linux/amd64(,|$)' \
              "${builder_inspect}"
            container_name="buildx_buildkit_${builder_name}0"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.Name}}' "${container_name}"
            )" = "/${container_name}"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.State.Running}}' "${container_name}"
            )" = "true"
            test "$(
              run_before_cleanup_deadline \
                "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
                docker inspect --format '{{.Config.Image}}' "${container_name}"
            )" = "${NOTEAI_BUILDKIT_IMAGE}"
            if ! run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              docker exec "${container_name}" sh -eu -c '
              root=/etc/buildkit/provenance.d
              [ ! -L "${root}" ] || exit 41
              [ ! -e "${root}" ] || [ -d "${root}" ] || exit 41
              for candidate in \
                "${root}"/*.json \
                "${root}"/.json \
                "${root}"/.[!.]*.json \
                "${root}"/..json \
                "${root}"/..*.json \
                "${root}"/..?*.json
              do
                if [ -e "${candidate}" ] || [ -L "${candidate}" ]; then
                  exit 41
                fi
              done
            ' </dev/null >/dev/null 2>&1
            then
              echo "BuildKit provenance drop-in gate failed" >&2
              exit 1
            fi
            rm -f -- "${builder_inspect}"
          done
          echo "admin_dependency_cache_buildkit_provenance_dropins=ABSENT builders=2"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build

      - name: Export V13 dependency-only BuildKit local cache
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v13
          NOTEAI_PLAN_CHECKPOINT_COMMIT: ${{ steps.control.outputs.plan_checkpoint_commit }}
          NOTEAI_CONTROL_COMMIT: ${{ steps.control.outputs.control_commit }}
          NOTEAI_REQUEST_SHA256: ${{ steps.control.outputs.request_sha256 }}
          NOTEAI_WORKFLOW_SHA256: ${{ steps.control.outputs.workflow_sha256 }}
          NOTEAI_EXPORT_HELPER_PATH: ${{ steps.control.outputs.export_helper_copy }}
          NOTEAI_IMPORT_HELPER_PATH: ${{ steps.control.outputs.import_helper_copy }}
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_V3_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v3_verifier_copy }}
          NOTEAI_V6_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v6_verifier_copy }}
          NOTEAI_V7_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v7_verifier_copy }}
          NOTEAI_V8_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v8_verifier_copy }}
          NOTEAI_V9_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v9_verifier_copy }}
          NOTEAI_V10_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v10_verifier_copy }}
          NOTEAI_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          test -z "$(git status --short)"
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase pre-build
          export_rc=0
          run_before_cleanup_deadline \
            "${NOTEAI_EXPORT_CALL_MAX_SECONDS}" \
            "${NOTEAI_EXPORT_HELPER_PATH}" || export_rc=$?
          if [[ "${export_rc}" -ne 0 ]]; then
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
              --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
              --runner-temp "${RUNNER_TEMP}" \
              --docker-config "${DOCKER_CONFIG}" \
              --buildx-config "${BUILDX_CONFIG}" \
              --phase cleanup-active
            exit "${export_rc}"
          fi
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          test -z "$(git status --short)"

      - name: Prove V13 fresh-consumer import and cacheless replay
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_IMPORT_MODE: ci_portability
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v13
          NOTEAI_SOURCE_DIR: ${{ github.workspace }}
          NOTEAI_BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
          NOTEAI_PRODUCER_BUILDER_NAME: ${{ env.NOTEAI_PRODUCER_BUILDER }}
          NOTEAI_IMPORT_EVIDENCE_DIR: ${{ runner.temp }}/unused-v13-import-evidence
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_V3_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v3_verifier_copy }}
          NOTEAI_V6_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v6_verifier_copy }}
          NOTEAI_V7_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v7_verifier_copy }}
          NOTEAI_V8_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v8_verifier_copy }}
          NOTEAI_V9_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v9_verifier_copy }}
          NOTEAI_V10_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v10_verifier_copy }}
          NOTEAI_TRUSTED_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.bundle_verifier_copy }}
          NOTEAI_EXPECTED_IMPORT_HELPER_SHA256: ${{ env.NOTEAI_IMPORT_HELPER_SHA256 }}
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
          BUILDX_BUILDER: ${{ env.NOTEAI_CONSUMER_BUILDER }}
        shell: bash
        run: |
          set -euo pipefail
          run_before_cleanup_deadline() {
            local maximum_seconds="$1"
            shift
            local now_epoch
            local remaining_seconds
            local timeout_seconds
            now_epoch="$(date +%s)"
            remaining_seconds="$((NOTEAI_PRE_CLEANUP_DEADLINE_EPOCH - now_epoch))"
            if [[ "${remaining_seconds}" -le 0 ]]; then
              return 124
            fi
            timeout_seconds="${maximum_seconds}"
            if [[ "${timeout_seconds}" -gt "${remaining_seconds}" ]]; then
              timeout_seconds="${remaining_seconds}"
            fi
            timeout \
              --signal=TERM \
              --kill-after=15s \
              "${timeout_seconds}s" \
              "$@"
          }
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          import_rc=0
          run_before_cleanup_deadline \
            "${NOTEAI_IMPORT_CALL_MAX_SECONDS}" \
            bash "${{ steps.control.outputs.import_helper_copy }}" ||
            import_rc=$?
          if [[ "${import_rc}" -ne 0 ]]; then
            run_before_cleanup_deadline \
              "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
              python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
              --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
              --runner-temp "${RUNNER_TEMP}" \
              --docker-config "${DOCKER_CONFIG}" \
              --buildx-config "${BUILDX_CONFIG}" \
              --phase cleanup-active
            exit "${import_rc}"
          fi
          run_before_cleanup_deadline \
            "${NOTEAI_SETUP_CALL_MAX_SECONDS}" \
            python3 "${NOTEAI_TRANSIENT_STATE_VERIFIER_PATH}" \
            --base-verifier "${NOTEAI_V4_TRANSIENT_VERIFIER_PATH}" \
            --runner-temp "${RUNNER_TEMP}" \
            --docker-config "${DOCKER_CONFIG}" \
            --buildx-config "${BUILDX_CONFIG}" \
            --phase post-build
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/SHA256SUMS"
          test -f "${NOTEAI_CACHE_BUNDLE_DIR}/portability/proof.json"
          jq -e '
            .import.v11_rawjson_diagnostic.schema_version ==
              "noteai.admin-dependency-cache-v11-diagnostic.v1"
            and .import.v11_rawjson_diagnostic.verdict == "pass"
            and .import.v11_rawjson_diagnostic.projection_kind ==
              "import-observer-prefix"
            and .import.v11_rawjson_diagnostic.observer.network_mode ==
              "NONE"
            and .import.v11_rawjson_diagnostic.observer.marker_occurrence_count ==
              1
            and .pair.classification == "SAME_DIGEST_CACHED"
            and .cache_record.schema_version ==
              "noteai.admin-dependency-cache-record.v13"
            and .cache_record.result_bearing_record_count > 0
            and .cache_record.link_count > 0
            and .cache_record.structural_validation == {
              cache_config_validated: true,
              direct_identity_path_claimed: false,
              record_and_layer_dag_validated: true,
              record_and_layer_reachability_validated: true,
              runtime_portability_proven: false,
              vertex_digest_binding_attempted: false
            }
            and .cacheless_replay.v10_rawjson_diagnostic.projection_kind ==
              "full-runtime-common"
            and .cacheless_replay.v10_rawjson_diagnostic.full_post_pip_witness.runtime_pip_terminal ==
              false
          ' "${NOTEAI_CACHE_BUNDLE_DIR}/portability/proof.json" >/dev/null

      - name: Remove V13 builders and all transient Docker state
        id: cleanup
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/noteai-empty-docker-config-v5
          BUILDX_CONFIG: ${{ runner.temp }}/noteai-buildx-state-v5
          NOTEAI_CLEANUP_RECEIPT_PATH: ${{ runner.temp }}/noteai-admin-dependency-cache-cleanup-v5.json
          NOTEAI_V4_TRANSIENT_VERIFIER_PATH: ${{ steps.control.outputs.v4_transient_verifier_copy }}
          NOTEAI_TRANSIENT_STATE_VERIFIER_PATH: ${{ steps.control.outputs.transient_verifier_copy }}
          NOTEAI_CLEANUP_HELPER_PATH: ${{ steps.control.outputs.cleanup_helper_copy }}
        shell: bash
        run: |
          set -euo pipefail
          bash "${NOTEAI_CLEANUP_HELPER_PATH}"
          jq -e '
            type == "object"
            and keys == [
              "buildx_root_absent",
              "cleanup_effective",
              "client_token_disabled",
              "consumer_builder_absent",
              "consumer_builder_remove",
              "containers_parity",
              "deadline_control_valid",
              "diagnostic_files_absent",
              "docker_baseline_state",
              "docker_root_absent",
              "images_parity",
              "networks_parity",
              "new_images_remove",
              "overall_pass",
              "post_builder_state",
              "pre_state",
              "producer_builder_absent",
              "producer_builder_remove",
              "schema_version",
              "volumes_parity"
            ]
            and .schema_version == 2
            and .deadline_control_valid == true
            and .client_token_disabled == true
            and .docker_baseline_state == "pass"
            and .producer_builder_absent == "pass"
            and .consumer_builder_absent == "pass"
            and .images_parity == "pass"
            and .containers_parity == "pass"
            and .volumes_parity == "pass"
            and .networks_parity == "pass"
            and .docker_root_absent == "pass"
            and .buildx_root_absent == "pass"
            and .diagnostic_files_absent == "pass"
            and .cleanup_effective == true
            and .overall_pass == true
          ' "${NOTEAI_CLEANUP_RECEIPT_PATH}" >/dev/null
          printf 'cleanup_passed=true\n' >> "${GITHUB_OUTPUT}"

      - name: Snapshot V2 through V13 ledgers after cleanup and before upload
        id: late_ledger
        if: ${{ always() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        shell: bash
        env:
          NOTEAI_ACTIONS_READ_TOKEN: ${{ github.token }}
          NOTEAI_V13_LEDGER_CONTRACT_PATH: ${{ steps.control.outputs.ledger_contract_copy }}
        run: |
          set -euo pipefail
          pre_ledger="${{ steps.pre_ledger.outputs.ledger_path }}"
          ledger_path="${RUNNER_TEMP}/noteai-cache-v13-post-cleanup-ledger.json"
          test -f "${pre_ledger}"
          test ! -e "${ledger_path}"
          PYTHONDONTWRITEBYTECODE=1 python3 \
            "${{ steps.control.outputs.ledger_verifier_copy }}" \
            live-ledger \
            --phase post_cleanup_pre_upload \
            --pre "${pre_ledger}" \
            --output "${ledger_path}"
          test -f "${ledger_path}"
          test "$(stat -c '%a' "${ledger_path}")" = "600"
          printf 'ledger_path=%s\n' "${ledger_path}" >> "${GITHUB_OUTPUT}"
          printf 'ledger_sha256=%s\n' "$(sha256sum "${ledger_path}" | awk '{print $1}')" \
            >> "${GITHUB_OUTPUT}"
      - name: Validate final V13 portable bundle after cleanup
        id: bundle
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        env:
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v13
          NOTEAI_BASE_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.base_verifier_copy }}
          NOTEAI_V3_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v3_verifier_copy }}
          NOTEAI_V6_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v6_verifier_copy }}
          NOTEAI_V7_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v7_verifier_copy }}
          NOTEAI_V8_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v8_verifier_copy }}
          NOTEAI_V9_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v9_verifier_copy }}
          NOTEAI_V10_BUNDLE_VERIFIER_PATH: ${{ steps.control.outputs.v10_verifier_copy }}
        shell: bash
        run: |
          set -euo pipefail
          expected_sums_sha256="$(
            tr -d '\r\n' < "${RUNNER_TEMP}/noteai-final-sums-sha256"
          )"
          test "$(
            printf '%s' "${expected_sums_sha256}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          jq -e '
            .archive.gzip_bytes <= .archive.maximum_gzip_bytes
            and .archive.maximum_gzip_bytes == 3758096384
          ' "${NOTEAI_CACHE_BUNDLE_DIR}/manifest.json" >/dev/null
          final_extract="${RUNNER_TEMP}/noteai-final-cache-v13-validation"
          python3 \
            "${{ steps.control.outputs.bundle_verifier_copy }}" \
            verify-final \
            --bundle "${NOTEAI_CACHE_BUNDLE_DIR}" \
            --extract-to "${final_extract}" \
            --expected-sums-sha256 "${expected_sums_sha256}" \
            --output "${RUNNER_TEMP}/noteai-final-bundle-v13-validation.json"
          jq -e '
            .artifact_input_bytes <= .artifact_input_maximum_bytes
            and .artifact_input_maximum_bytes == 4026531840
            and .artifact_provider_maximum_bytes == 4294967296
            and .pair_classification == "SAME_DIGEST_CACHED"
          ' "${RUNNER_TEMP}/noteai-final-bundle-v13-validation.json" >/dev/null
          rm -rf --one-file-system -- "${final_extract}"
          test ! -e "${final_extract}"
          printf 'final_sums_sha256=%s\n' "${expected_sums_sha256}" \
            >> "${GITHUB_OUTPUT}"

      - name: Upload one-day V13 public-repository dependency cache artifact
        id: upload
        if: ${{ success() && steps.cleanup.outputs.cleanup_passed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.NOTEAI_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v13
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

      - name: Confirm V13 provider artifact identity
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${{ steps.upload.outputs.artifact-id }}"
          test "$(
            printf '%s' "${{ steps.upload.outputs.artifact-digest }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          test "$(
            printf '%s' "${{ steps.bundle.outputs.final_sums_sha256 }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          test "$(
            printf '%s' "${{ steps.pre_ledger.outputs.ledger_sha256 }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          test "$(
            printf '%s' "${{ steps.late_ledger.outputs.ledger_sha256 }}" |
              grep -Ec '^[0-9a-f]{64}$'
          )" = "1"
          echo "admin_dependency_cache_v13_artifact=UPLOADED retention_days=1 run_attempt=1 pre_ledger_sha256=${{ steps.pre_ledger.outputs.ledger_sha256 }} post_ledger_sha256=${{ steps.late_ledger.outputs.ledger_sha256 }}"

      - name: Remove runner-local V13 bundle
        if: always()
        env:
          NOTEAI_CACHE_BUNDLE_DIR: ${{ runner.temp }}/noteai-admin-dependency-cache-bundle-v13
          NOTEAI_CLEANUP_RECEIPT_PATH: ${{ runner.temp }}/noteai-admin-dependency-cache-cleanup-v5.json
        shell: bash
        run: |
          set -euo pipefail
          test "${NOTEAI_CACHE_BUNDLE_DIR}" = \
            "${RUNNER_TEMP}/noteai-admin-dependency-cache-bundle-v13"
          test ! -L "${NOTEAI_CACHE_BUNDLE_DIR}"
          if [[ -e "${NOTEAI_CACHE_BUNDLE_DIR}" ]]; then
            rm -rf --one-file-system -- "${NOTEAI_CACHE_BUNDLE_DIR}"
          fi
          test ! -e "${NOTEAI_CACHE_BUNDLE_DIR}"
          for ledger_path in \
            "${{ steps.pre_ledger.outputs.ledger_path }}" \
            "${{ steps.late_ledger.outputs.ledger_path }}"
          do
            if [[ -n "${ledger_path}" ]]; then
              case "${ledger_path}" in
                "${RUNNER_TEMP}/noteai-cache-v13-"*-ledger.json) ;;
                *) exit 1 ;;
              esac
              rm -f -- "${ledger_path}"
              test ! -e "${ledger_path}"
            fi
          done
          test "${NOTEAI_CLEANUP_RECEIPT_PATH}" = \
            "${RUNNER_TEMP}/noteai-admin-dependency-cache-cleanup-v5.json"
          test ! -L "${NOTEAI_CLEANUP_RECEIPT_PATH}"
          rm -f -- "${NOTEAI_CLEANUP_RECEIPT_PATH}"
          test ! -e "${NOTEAI_CLEANUP_RECEIPT_PATH}"
