      NOTEAI_PROVIDER_DOWNLOAD_VERIFIER_SHA256: ca05697d12b8c02b183b1c611c33781d63641c5369bc54b2508a538591a0986b
      NOTEAI_BUILDKIT_IMAGE: moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
